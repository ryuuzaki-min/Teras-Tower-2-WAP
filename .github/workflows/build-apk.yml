# ===================================================================
# Build APK Teras Tower 2 + terbitkan versi PWA (untuk iPhone)
# -------------------------------------------------------------------
# Cara memakai (cukup dari HP lewat github.com):
#   • Uji coba: tab Actions -> "Build APK & PWA" -> Run workflow.
#     APK muncul di bagian Artifacts pada hasil run.
#   • Rilis ke warga: buat tag/rilis bernama v1.0.0, v1.0.1, dst.
#     APK + SHA-256 otomatis dilampirkan ke GitHub Release.
#
# URL Web App diambil dari app.config.json (boleh ditimpa Variable TT2_API_URL).
# Folder android/ dibuat otomatis setiap build (tidak disimpan di repo).
#
# Pengaturan sekali di Settings repo:
#   Secrets (Settings > Secrets and variables > Actions) — wajib untuk APK warga
#     TT2_KEYSTORE_BASE64    isi file keystore dalam base64
#     TT2_KEYSTORE_PASSWORD  sandi keystore
#     TT2_KEY_ALIAS          alias kunci (mis. terastower2)
#     TT2_KEY_PASSWORD       sandi kunci
#   Pages (Settings > Pages > Source: GitHub Actions) — untuk versi iPhone/PWA
#
# Tanpa secret keystore, workflow tetap jalan tetapi menghasilkan APK DEBUG
# yang hanya untuk uji coba (kuncinya berganti setiap build, jadi tidak bisa
# dipakai untuk pembaruan di HP warga).
# ===================================================================
name: Build APK & PWA

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # versionCode Android harus selalu naik. run_number GitHub selalu bertambah.
  TT2_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Pasang dependensi
        run: npm ci

      - name: Uji backend (sesi, registrasi, router API)
        run: node tools/test/backend.test.cjs

      - name: Periksa versi
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak sama dengan versi package.json ($VERSION). Samakan dulu."
            exit 1
          fi
          echo "TT2_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"

      - name: Bangun www/ dari sumber Apps Script
        env:
          TT2_API_URL: ${{ vars.TT2_API_URL }}
        run: node tools/build-web.mjs

      - name: Buat proyek Android, ikon & splash dari logo
        run: |
          rm -rf android
          npx cap add android
          node tools/prepare-android.mjs
          npm run assets
          npx cap sync android

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.TT2_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TT2_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TT2_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TT2_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "TT2_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "TT2_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "TT2_KEY_ALIAS=$KEY_ALIAS"
              echo "TT2_KEY_PASSWORD=$KEY_PASSWORD"
              echo "TT2_SIGNED=1"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Secret keystore belum ada. Menghasilkan APK DEBUG (khusus uji coba, jangan dibagikan ke warga)."
            echo "TT2_SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$TT2_SIGNED" = "1" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi

      - name: Beri nama & checksum
        run: |
          mkdir -p dist
          if [ "$TT2_SIGNED" = "1" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
            NAME="TerasTower2-v${TT2_VERSION_NAME}.apk"
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
            NAME="TerasTower2-v${TT2_VERSION_NAME}-build${TT2_BUILD_NUMBER}-UJI-COBA.apk"
          fi
          cp "$SRC" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          cat "dist/$NAME.sha256"
          if [ "$TT2_SIGNED" = "1" ]; then
            "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "dist/$NAME" | head -5 || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/*
          retention-days: 30

      - name: Lampirkan ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.TT2_SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="APK Teras Tower 2 versi ${TT2_VERSION_NAME} (build ${TT2_BUILD_NUMBER}). Cocokkan SHA-256 dengan berkas .sha256."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Teras Tower 2 ${GITHUB_REF_NAME}" --notes "$NOTES"
          fi

  pwa:
    name: Versi iPhone/PWA (GitHub Pages)
    runs-on: ubuntu-latest
    needs: android
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bangun www/
        env:
          TT2_API_URL: ${{ vars.TT2_API_URL }}
        run: |
          npm ci
          export TT2_VERSION_NAME=$(node -p "require('./package.json').version")
          node tools/build-web.mjs
      - uses: actions/configure-pages@v5
        continue-on-error: true
        id: pages
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: www
      - uses: actions/deploy-pages@v4
        if: steps.pages.outcome == 'success'
        id: deploy
