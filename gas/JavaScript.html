  function verifyResidentAccount(username, nama, nomor, status, lantai, unit) {
    const resident = wargaAdminCache.find(function (row) { return String(row.Username || '').toLowerCase() === String(username || '').toLowerCase(); });
    const rawNumber = nomor || (resident && resident.Nomor_WhatsApp) || '';
    const phone = normalizeWhatsAppNumber(rawNumber);
    if (!phone) {
      showAppNotice('Nomor WhatsApp belum dapat dipakai untuk akun ini. Pastikan nomor di data warga tidak tertutup/berisi tanda masking; format yang didukung: 08…, 8…, 62… atau +62…. Perbarui nomor melalui Profil Saya.', 'error');
      return;
    }
    const residentName = nama || (resident && resident.Nama) || username;
    const residentStatus = status || (resident && resident.Status_Wisma) || '';
    const residentFloor = lantai || (resident && resident.Lantai) || '';
    const residentUnit = unit || (resident && resident.Unit) || '';
    const complete = !!String(residentName || '').trim() && !!String(residentStatus || '').trim() && (String(residentStatus || '') !== 'Penghuni BAST' || (!!String(residentFloor || '').trim() && !!String(residentUnit || '').trim()));
    const message = complete
      ? 'Halo ' + residentName + ', Admin Teras Tower 2 sedang melakukan verifikasi akun. Mohon konfirmasi bahwa data akun dan data hunian Anda sudah benar. Jika ada yang salah, silakan perbarui melalui Profil Saya.'
      : 'Halo ' + residentName + ', Admin Teras Tower 2 sedang melakukan verifikasi akun. Mohon lengkapi atau perbarui data akun dan data hunian Anda melalui Profil Saya.';
    window.open(buildWaLink(phone) + '?text=' + encodeURIComponent(message), '_blank', 'noopener,noreferrer');
  }

  function resetPinAndWhatsApp(username) {
    const resident = wargaAdminCache.find(function (row) { return String(row.Username || '').toLowerCase() === String(username || '').toLowerCase(); });
    if (!resident) { showAppNotice('Data warga tidak ditemukan. Muat ulang Kelola Warga lalu coba lagi.', 'error'); return; }
    const phone = normalizeWhatsAppNumber(resident.Nomor_WhatsApp);
    if (!phone) {
      showAppNotice('Reset PIN + WhatsApp tidak dapat dijalankan karena nomor WhatsApp belum tersedia atau formatnya tidak terbaca. Perbarui nomor warga melalui Profil Saya.', 'error');
      return;
    }
    showAppConfirm('PIN ' + username + ' akan diganti dengan PIN acak baru. Draft WhatsApp berisi PIN baru akan dibuka, tetapi tidak dikirim otomatis. Lanjutkan?', function () {
      // Open synchronously from the confirmation click to avoid popup blockers
      // when the server reply arrives asynchronously.
      const chatWindow = window.open('about:blank', '_blank');
      if (!chatWindow) { showAppNotice('Browser memblokir tab WhatsApp. Izinkan pop-up lalu coba lagi; PIN belum direset.', 'error'); return; }
      try { chatWindow.document.title = 'Menyiapkan pesan WhatsApp…'; chatWindow.document.body.textContent = 'Memproses reset PIN dengan aman…'; } catch (ignore) {}
      runServerWithLoader()
        .withSuccessHandler(function (result) {
          if (!result || !result.success || !result.pin) {
            try { chatWindow.close(); } catch (ignore) {}
            showAppNotice('Gagal mereset PIN: ' + ((result && result.message) || 'PIN baru tidak diterima.'), 'error');
            return;
          }
          const message = 'Halo ' + (resident.Nama || username) + ', PIN akun Teras Tower 2 Anda telah direset oleh Admin. PIN baru Anda: ' + result.pin + '. Gunakan PIN tersebut untuk masuk ke aplikasi. Demi keamanan, jangan bagikan PIN ini kepada siapa pun selain Admin Teras Tower 2.';
          const waUrl = buildWaLink(phone) + '?text=' + encodeURIComponent(message);
          try { chatWindow.location.href = waUrl; }
          catch (err) { try { chatWindow.close(); } catch (ignore) {} showAppNotice('PIN berhasil direset (' + result.pin + '), tetapi WhatsApp tidak dapat dibuka. Hubungi warga secara manual.', 'error'); }
          showAppNotice('PIN berhasil dibuat dan draft WhatsApp untuk ' + username + ' sudah disiapkan. Periksa nomor dan isi pesan, lalu tekan Kirim di WhatsApp.');
          renderKelolaWarga(true);
        })
        .withFailureHandler(function (err) {
          try { chatWindow.close(); } catch (ignore) {}
          showAppNotice('Gagal mereset PIN: ' + (err.message || 'kesalahan server.'), 'error');
        })
        .resetPin({ adminUsername: currentUser.username, username: username, sessionToken: currentUser.sessionToken });
    }, 'Reset & buka WhatsApp');
  }

  var bgImageFileState = null;
  function onBgImageSelected(event) {
    const file = event.target.files[0];
    if (!file) { bgImageFileState = null; return; }
    const finish = beginClientProcess('Mengolah gambar latar…');
    let completed = false;
    const finishOnce = function () { if (!completed) { completed = true; finish(); } };
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        try {
          const scale = Math.min(1, 1600 / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          bgImageFileState = { base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', fileName: (file.name || 'background').replace(/\.[^.]+$/, '') + '.jpg' };
          document.getElementById('bgImagePreview').innerHTML = '<img src="' + dataUrl + '" style="max-width:100%;border-radius:8px;margin-top:8px;">';
        } catch (err) { showAppNotice('Gambar latar tidak dapat diproses.'); }
        finally { finishOnce(); }
      };
      img.onerror = function() { finishOnce(); showAppNotice('File gambar tidak dapat dibaca.'); };
      img.src = e.target.result;
    };
    reader.onerror = function() { finishOnce(); showAppNotice('File gambar tidak dapat dibaca.'); };
    try { reader.readAsDataURL(file); } catch (err) { finishOnce(); showAppNotice('File gambar tidak dapat dibaca.'); }
  }

  // ===================================================================
  // v15: EDITOR WARNA TEMA (pengganti popup warna bawaan HP)
  // -------------------------------------------------------------------
  // Warna tetap bebas. Admin menggeser Rona/Kepekatan/Terang, mengetik kode hex,
  // atau memilih contoh dari logo. Pratinjau memakai rumus yang sama dengan
  // applyTheme(), jadi yang terlihat di sini = yang dipakai aplikasi.
  // Nilai akhir disimpan di input tersembunyi #customPrimaryColor (dibaca saveCustomized).
  // ===================================================================
  const THEME_COLOR_PRESETS = [
    { hex: '#0E9C9A', name: 'Teal logo' }, { hex: '#1A6FD1', name: 'Biru logo' }, { hex: '#0A3A80', name: 'Biru tua logo' },
    { hex: '#0A86D0', name: 'Biru langit' }, { hex: '#19B786', name: 'Hijau' }, { hex: '#27CCF5', name: 'Bawaan' }
  ];
  function hexToHsl(hex) {
    const c = hexToRgb(hex); if (!c) return { h: 180, s: 70, l: 40 };
    const r = c.r / 255, g = c.g / 255, b = c.b / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
    let h = 0, s = 0;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
  }
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = function (n) { return (n + h / 30) % 12; };
    const a = s * Math.min(l, 1 - l);
    const f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
    return '#' + [f(0), f(8), f(4)].map(function (x) { return ('0' + Math.round(x * 255).toString(16)).slice(-2); }).join('').toUpperCase();
  }
  function normalizeHexInput(value) {
    let v = String(value || '').trim().toUpperCase();
    if (v && v.charAt(0) !== '#') v = '#' + v;
    if (/^#[0-9A-F]{3}$/.test(v)) v = '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
    return /^#[0-9A-F]{6}$/.test(v) ? v : '';
  }
  function renderThemeColorEditor(initialHex) {
    const hex = normalizeHexInput(initialHex) || '#27CCF5';
    return '<div class="field theme-editor">' +
      '<label for="themeHexInput">Warna utama aplikasi</label>' +
      '<input type="hidden" id="customPrimaryColor" value="' + escapeAttr(hex) + '">' +
      '<div class="theme-editor-head">' +
        '<span class="theme-swatch-big" id="themeSwatch" aria-hidden="true"></span>' +
        '<div class="theme-hex-box"><span>Kode warna</span><input type="text" id="themeHexInput" value="' + escapeAttr(hex) + '" maxlength="7" autocomplete="off" spellcheck="false" inputmode="text"></div>' +
      '</div>' +
      '<div class="theme-slider-row"><label for="themeHue">Rona</label><input type="range" id="themeHue" class="theme-slider" min="0" max="359" step="1"><output id="themeHueOut"></output></div>' +
      '<div class="theme-slider-row"><label for="themeSat">Kepekatan</label><input type="range" id="themeSat" class="theme-slider" min="0" max="100" step="1"><output id="themeSatOut"></output></div>' +
      '<div class="theme-slider-row"><label for="themeLight">Terang</label><input type="range" id="themeLight" class="theme-slider" min="10" max="85" step="1"><output id="themeLightOut"></output></div>' +
      '<div class="theme-presets" role="group" aria-label="Contoh warna">' + THEME_COLOR_PRESETS.map(function (p) {
        return '<button type="button" class="theme-preset" data-hex="' + p.hex + '" style="--preset:' + p.hex + '" aria-label="' + escapeAttr(p.name + ' ' + p.hex) + '" title="' + escapeAttr(p.name) + '"></button>';
      }).join('') + '</div>' +
      '<div class="theme-preview" id="themePreview" aria-live="polite">' +
        '<div class="theme-preview-title">Pratinjau</div>' +
        '<div class="theme-preview-heading">Selamat Malam</div>' +
        '<div class="theme-preview-row"><span class="theme-preview-chip">Dibaca</span><span class="theme-preview-link">← Kembali</span></div>' +
        '<span class="theme-preview-button">Simpan</span>' +
      '</div>' +
    '</div>';
  }
  function initThemeColorEditor() {
    const hidden = document.getElementById('customPrimaryColor');
    const hexInput = document.getElementById('themeHexInput');
    const hue = document.getElementById('themeHue'), sat = document.getElementById('themeSat'), light = document.getElementById('themeLight');
    if (!hidden || !hexInput || !hue) return;
    function paint(hex, fromSliders) {
      hidden.value = hex;
      if (document.activeElement !== hexInput) hexInput.value = hex;
      hexInput.classList.remove('invalid');
      const hsl = hexToHsl(hex);
      if (!fromSliders) { hue.value = hsl.h; sat.value = hsl.s; light.value = Math.max(10, Math.min(85, hsl.l)); }
      const h = Number(hue.value), s = Number(sat.value), l = Number(light.value);
      document.getElementById('themeHueOut').textContent = h + '°';
      document.getElementById('themeSatOut').textContent = s + '%';
      document.getElementById('themeLightOut').textContent = l + '%';
      hue.style.setProperty('--track', 'linear-gradient(90deg,' + [0, 60, 120, 180, 240, 300, 359].map(function (x) { return hslToHex(x, s, l); }).join(',') + ')');
      sat.style.setProperty('--track', 'linear-gradient(90deg,' + hslToHex(h, 0, l) + ',' + hslToHex(h, 100, l) + ')');
      light.style.setProperty('--track', 'linear-gradient(90deg,' + hslToHex(h, s, 10) + ',' + hslToHex(h, s, 50) + ',' + hslToHex(h, s, 85) + ')');
      const rgb = hexToRgb(hex);
      const lum = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b) / 255;
      const preview = document.getElementById('themePreview');
      preview.style.setProperty('--pv-primary', hex);
      preview.style.setProperty('--pv-deep', darkenForContrast(rgb, 5.2, lum > 0.7 ? 0.5 : 0.25));
      preview.style.setProperty('--pv-strong', darkenForContrast(rgb, 4.5, 0));
      preview.style.setProperty('--pv-pastel', mixRgb(rgb, 255, 0.88));
      document.getElementById('themeSwatch').style.background = hex;
      document.querySelectorAll('.theme-preset').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-hex') === hex ? 'true' : 'false'); });
    }
    function fromSliders() { paint(hslToHex(Number(hue.value), Number(sat.value), Number(light.value)), true); }
    [hue, sat, light].forEach(function (el) { el.addEventListener('input', fromSliders); });
    hexInput.addEventListener('input', function () {
      const hex = normalizeHexInput(hexInput.value);
      if (hex) paint(hex, false); else hexInput.classList.add('invalid');
    });
    hexInput.addEventListener('blur', function () { hexInput.value = hidden.value; hexInput.classList.remove('invalid'); });
    document.querySelectorAll('.theme-preset').forEach(function (button) {
      button.addEventListener('click', function () { paint(button.getAttribute('data-hex'), false); });
    });
    paint(normalizeHexInput(hidden.value) || '#27CCF5', false);
  }

  function saveCustomized() {
    const config = {
      PrimaryColor: document.getElementById('customPrimaryColor').value,
      BackgroundImage: document.getElementById('customBgImage').value.trim()
    };
    const payload = { config: config, adminUsername: currentUser.username , sessionToken: currentUser.sessionToken };
    if (bgImageFileState) {
      payload.bgImage = bgImageFileState;
    }
    const btn = document.getElementById('btnSaveCustomized');
    btn.disabled = true; btn.innerText = 'Menyimpan...';

    runServerWithLoader()
      .withSuccessHandler(function(result) {
        btn.disabled = false; btn.innerText = 'Simpan Perubahan';
        try {
          if (!result.success) { showAppNotice('Gagal menyimpan: ' + result.message); return; }
          if (result.bgImageUrl) config.BackgroundImage = result.bgImageUrl;
          systemConfig = Object.assign({}, systemConfig, config);
          bgImageFileState = null;
          const fileInput = document.getElementById('customBgImageFile');
          const bgInput = document.getElementById('customBgImage');
          const preview = document.getElementById('bgImagePreview');
          if (fileInput) fileInput.value = '';
          if (bgInput) bgInput.value = config.BackgroundImage;
          if (preview) preview.innerHTML = '';
          applyTheme();
          showAppNotice('Pengaturan tersimpan dan langsung diterapkan.');
        } catch (e) {
          showAppNotice('Tersimpan di server, tapi ada error saat menerapkan tampilan: ' + e.message);
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false; btn.innerText = 'Simpan Perubahan';
        showAppNotice('Gagal menyimpan: ' + err.message);
      })
      .updateSystemConfig(payload);
  }

  // ===================================================================
  // KELOLA BANNER (Admin / Super Admin)
  // ===================================================================
  var bannerDraft = [];

  function syncBannerDraft() {
    document.querySelectorAll('.banner-admin-item').forEach(function (row, i) {
      if (!bannerDraft[i]) return;
      bannerDraft[i].link = row.querySelector('.banner-link-input').value.trim();
      bannerDraft[i].aktif = row.querySelector('.banner-active-input').checked;
    });
  }

  function renderBannerAdmin() {
    const box = document.getElementById('bannerAdminList');
    if (!box) return;
    if (!bannerDraft.length) { box.innerHTML = '<div class="empty-state">Belum ada banner.</div>'; return; }
    box.innerHTML = bannerDraft.map(function (b, i) {
      return '<div class="banner-admin-item">' +
        '<img class="banner-admin-thumb" src="' + escapeAttr(b.preview || b.url) + '" alt="Banner ' + (i + 1) + '">' +
        '<div class="banner-admin-body">' +
          '<input type="text" class="banner-link-input" placeholder="Link tujuan (opsional, https://...)" value="' + escapeAttr(b.link || '') + '">' +
          '<label class="banner-admin-active"><input type="checkbox" class="banner-active-input"' + (b.aktif !== false ? ' checked' : '') + '> Tampilkan</label>' +
        '</div>' +
        '<div class="banner-admin-actions">' +
          '<button type="button" onclick="moveBanner(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + ' aria-label="Naikkan">▲</button>' +
          '<button type="button" onclick="moveBanner(' + i + ',1)"' + (i === bannerDraft.length - 1 ? ' disabled' : '') + ' aria-label="Turunkan">▼</button>' +
          '<button type="button" onclick="removeBanner(' + i + ')" aria-label="Hapus">🗑️</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function moveBanner(i, dir) {
    syncBannerDraft();
    const j = i + dir;
    if (j < 0 || j >= bannerDraft.length) return;
    const tmp = bannerDraft[i]; bannerDraft[i] = bannerDraft[j]; bannerDraft[j] = tmp;
    renderBannerAdmin();
  }

  function removeBanner(i) {
    showAppConfirm('Hapus banner ini?', function () {
      syncBannerDraft();
      bannerDraft.splice(i, 1);
      renderBannerAdmin();
    }, 'Hapus');
  }

  // Potong tengah ke rasio 2:1, kecilkan ke 1200x600, simpan sebagai JPEG
  function prepareBannerImage(file, done) {
    const finish = beginClientProcess('Mengolah gambar banner…');
    let completed = false;
    const finishOnce = function () { if (!completed) { completed = true; finish(); } };
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        try {
          const W = 1200, H = 600;
          const canvas = document.createElement('canvas');
          canvas.width = W; canvas.height = H;
          const ctx = canvas.getContext('2d');
          const scale = Math.max(W / img.width, H / img.height);
          const sw = W / scale, sh = H / scale;
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
          ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, W, H);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          done({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', fileName: (file.name || 'banner').replace(/\.[^.]+$/, '') + '.jpg', preview: dataUrl });
        } catch (err) { showAppNotice('Gambar banner tidak dapat diproses.'); }
        finally { finishOnce(); }
      };
      img.onerror = function () { finishOnce(); showAppNotice('File gambar tidak dapat dibaca.'); };
      img.src = e.target.result;
    };
    reader.onerror = function () { finishOnce(); showAppNotice('File gambar tidak dapat dibaca.'); };
    try { reader.readAsDataURL(file); } catch (err) { finishOnce(); showAppNotice('File gambar tidak dapat dibaca.'); }
  }

  function onBannerFileSelected(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    syncBannerDraft();
    if (bannerDraft.length >= BANNER_MAX) { showAppNotice('Maksimal ' + BANNER_MAX + ' banner. Hapus salah satu dulu.'); input.value = ''; return; }
    prepareBannerImage(file, function (img) {
      bannerDraft.push({ id: 'new_' + Date.now(), url: '', link: '', aktif: true, upload: { base64: img.base64, mimeType: img.mimeType, fileName: img.fileName }, preview: img.preview });
      input.value = '';
      renderBannerAdmin();
    });
  }

  function submitBanners() {
    syncBannerDraft();
    for (let i = 0; i < bannerDraft.length; i++) {
      if (bannerDraft[i].link && !isSafeBannerLink(bannerDraft[i].link)) { showAppNotice('Link banner ke-' + (i + 1) + ' harus diawali http:// atau https://'); return; }
    }
    const btn = document.getElementById('btnSaveBanners');
    btn.disabled = true; btn.innerText = 'Menyimpan...';
    const payload = {
      sessionToken: currentUser.sessionToken,
      banners: bannerDraft.map(function (b) { return { id: b.id, url: b.url, link: b.link, aktif: b.aktif, upload: b.upload || null }; })
    };
    runServerWithLoader()
      .withSuccessHandler(function (result) {
        btn.disabled = false; btn.innerText = 'Simpan Banner';
        if (!result.success) { showAppNotice('Gagal menyimpan banner: ' + result.message); return; }
        systemConfig = Object.assign({}, systemConfig, { BannerList: result.bannerList });
        bannerDraft = getBannerListRaw().map(function (b) { return { id: b.id, url: b.url, link: b.link || '', aktif: b.aktif !== false }; });
        renderBannerAdmin();
        showAppNotice('Banner berhasil disimpan.');
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.innerText = 'Simpan Banner';
        showAppNotice('Gagal menyimpan banner: ' + err.message);
      })
      .saveBanners(payload);
  }

  // ===================================================================
  // PROFIL SAYA
  // ===================================================================
  function renderProfil() {
    if (refDataCache) {
      buildProfilHTML();
    } else {
      runServerWithLoader()
        .withSuccessHandler(function (data) { refDataCache = data; buildProfilHTML(); })
        .withFailureHandler(function (err) { buildProfilHTML(); console.error(err); })
        .getRefData();
    }
  }

  function buildProfilHTML() {
    const isResident = !currentUser.isAdmin && !currentUser.isSuperAdmin;
    const isBAST = isResident && currentUser.statusWisma === 'Penghuni BAST';
    const floorUnit = splitFloorUnit8O(currentUser.lantai, currentUser.unit);
    const wismaHtml = isResident ?
      '<div class="card" style="margin-top:12px;">' +
        '<div class="card-title" style="font-size:16px;margin-bottom:12px;">🏠 Informasi Wisma</div>' +
        '<div class="field"><label>Status di Wisma <span style="font-weight:normal;color:var(--color-text-muted);">(tidak bisa diubah)</span></label><input type="text" value="' + escapeAttr(currentUser.statusWisma || '') + '" disabled style="background:#f0f0f0;"></div>' +
        '<div class="floor-unit-row" id="wrapEditFloorUnit" style="display:' + (isBAST ? 'grid' : 'none') + ';"><div class="field" id="wrapEditLantai"><label>Lantai</label><select id="editLantai" onchange="syncFloorUnit8O(&quot;edit&quot;, &quot;editLantai&quot;, &quot;editUnitSuffix&quot;, &quot;editUnitPrefix&quot;)"></select></div><div class="field" id="wrapEditUnit"><label>Unit</label><div class="unit-composite"><span class="unit-prefix" id="editUnitPrefix">' + escapeHtml(floorUnit.floor || '--') + '</span><select id="editUnitSuffix" disabled></select></div></div></div>' +
      '</div>' : '';

    const html = getTopBar('Profil') + '<div class="page-title">Profil Saya</div>' +
      '<div class="card">' +
        '<div class="card-title" style="font-size:16px;margin-bottom:12px;">👤 Informasi Akun</div>' +
        '<div class="field"><label>Username</label><input type="text" value="' + escapeAttr(currentUser.username) + '" disabled style="background:#f0f0f0;"></div>' +
        '<div class="field"><label>Nama Lengkap</label><input type="text" id="editNama" value="' + escapeAttr(currentUser.name || '') + '"></div>' +
        '<div class="field"><label>Nomor WhatsApp</label><input type="text" id="editWA" value="' + escapeAttr(currentUser.nomorWhatsApp || '') + '"></div>' +
      '</div>' + wismaHtml +
      '<button class="btn-primary" onclick="updateProfil()" style="margin-top:8px;">Simpan Perubahan</button>' +
      (isResident ? deleteAccountCardHTML() : '') +
      getCopyrightFooter();
    document.getElementById('pageContent').innerHTML = html;

    if (isBAST) populateFloorUnit8O('edit', currentUser.lantai, currentUser.unit);
  }

  // v18: hapus akun mandiri (syarat Google Play).
  function deleteAccountCardHTML() {
    return '<div class="card danger-zone" id="deleteAccountCard">' +
      '<div class="card-title">Hapus akun</div>' +
      '<p class="danger-zone-text">Akun dan data pribadi Anda (nama, nomor WhatsApp, unit, PIN, simpanan, dan notifikasi) akan dihapus permanen. ' +
      'Aspirasi yang pernah Anda kirim tetap ada sebagai catatan pengelolaan dengan inisial nama saja; nomor WhatsApp dan unit disandikan. Ulasan, rekomendasi, dan apresiasi tetap tampil tanpa nama Anda. ' +
        '<a class="footer-link" href="' + PRIVACY_POLICY_URL + '" target="_blank" rel="noopener">Kebijakan Privasi</a></p>' +
      '<div id="deleteAccountForm" hidden>' +
        '<div class="field"><label for="deleteAccountPin">PIN Anda</label><input type="password" id="deleteAccountPin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password"></div>' +
        '<div class="field"><label for="deleteAccountConfirm">Ketik <strong>HAPUS</strong> untuk mengonfirmasi</label><input type="text" id="deleteAccountConfirm" autocomplete="off" autocapitalize="characters"></div>' +
        '<button type="button" class="btn-danger" onclick="submitDeleteAccount()">Hapus akun saya permanen</button>' +
        '<button type="button" class="btn-secondary" onclick="toggleDeleteAccountForm(false)">Batal</button>' +
      '</div>' +
      '<button type="button" class="btn-danger-outline" id="btnShowDeleteAccount" onclick="toggleDeleteAccountForm(true)">Hapus akun saya…</button>' +
    '</div>';
  }

  function toggleDeleteAccountForm(show) {
    const form = document.getElementById('deleteAccountForm');
    const opener = document.getElementById('btnShowDeleteAccount');
    if (!form || !opener) return;
    form.hidden = !show; opener.hidden = !!show;
    if (show) document.getElementById('deleteAccountPin').focus();
  }

  function submitDeleteAccount() {
    const pin = document.getElementById('deleteAccountPin').value.trim();
    const konfirmasi = document.getElementById('deleteAccountConfirm').value.trim();
    if (!/^\d{6}$/.test(pin)) { showAppNotice('Masukkan PIN 6 angka Anda.', 'error'); return; }
    if (konfirmasi.toUpperCase() !== 'HAPUS') { showAppNotice('Ketik HAPUS untuk mengonfirmasi.', 'error'); return; }
    showAppConfirm('Akun Anda akan dihapus permanen dan tidak bisa dikembalikan. Lanjutkan?', function () {
      const endingToken = currentUser.sessionToken;
      runServerWithLoader()
        .withSuccessHandler(function (result) {
          if (!result || !result.success) { showAppNotice((result && result.message) || 'Akun belum terhapus.', 'error'); return; }
          const finish = function () { returnToLoginScreen(); showAppDialog(result.message, { title: 'Akun dihapus' }); };
          if (window.TT2Shell && typeof window.TT2Shell.onSignedOut === 'function') window.TT2Shell.onSignedOut(endingToken).then(finish, finish);
          else finish();
        })
        .withFailureHandler(function (err) { showAppNotice('Akun belum terhapus: ' + (err && err.message || err), 'error'); })
        .deleteMyAccount({ sessionToken: endingToken, pin: pin, konfirmasi: konfirmasi });
    }, 'Hapus permanen');
  }

  function updateProfil() {
    const nama = document.getElementById('editNama').value.trim();
    const wa = document.getElementById('editWA').value.trim();
    const isResident = !currentUser.isAdmin && !currentUser.isSuperAdmin;
    const status = isResident ? currentUser.statusWisma : '';
    let lantai = '', unit = '';
    if (isResident && status === 'Penghuni BAST') { lantai = document.getElementById('editLantai').value.trim(); unit = fullUnit8O(lantai, document.getElementById('editUnitSuffix').value.trim()); }
    const payload = { username: currentUser.username, nama: nama, statusWisma: status, lantai: lantai, unit: unit, nomorWhatsApp: wa , sessionToken: currentUser.sessionToken };
    runServerWithLoader()
      .withSuccessHandler(function(result) {
        if (result.success) {
          currentUser.name = nama; currentUser.lantai = lantai; currentUser.unit = unit; currentUser.nomorWhatsApp = wa;
          updateStoredSession(currentUser);
          showAppNotice('Profil berhasil diperbarui!');
        } else showAppNotice('Gagal: ' + result.message);
      })
      .withFailureHandler(function(err) { showAppNotice('Gagal: ' + err.message); })
      .updateProfile(payload);
  }
