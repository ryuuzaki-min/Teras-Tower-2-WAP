<script>
  // ===================================================================
  // PENYIMPANAN SESI — hybrid localStorage/sessionStorage
  // Kalau "Ingat saya di perangkat ini" dicentang saat login -> localStorage
  // (tetap login walau tab/app ditutup). Kalau tidak -> sessionStorage
  // (otomatis logout saat tab ditutup, lebih aman untuk perangkat bersama).
  // ===================================================================
  const SESSION_KEY = 'teras_tower_user';
  function saveSession(user, remember) {
    const json = JSON.stringify(user);
    if (remember) {
      localStorage.setItem(SESSION_KEY, json);
      sessionStorage.removeItem(SESSION_KEY);
    } else {
      sessionStorage.setItem(SESSION_KEY, json);
      localStorage.removeItem(SESSION_KEY);
    }
  }
  // Dipakai saat currentUser berubah (mis. update profil) setelah login —
  // tulis ulang ke tempat yang SUDAH dipakai sesi ini, tanpa perlu tahu lagi
  // pilihan "ingat saya" sebelumnya.
  function updateStoredSession(user) {
    const json = JSON.stringify(user);
    if (localStorage.getItem(SESSION_KEY) !== null) localStorage.setItem(SESSION_KEY, json);
    else sessionStorage.setItem(SESSION_KEY, json);
  }
  function loadSessionCandidates() {
    const candidates = [];
    const sessionJson = sessionStorage.getItem(SESSION_KEY);
    const localJson = localStorage.getItem(SESSION_KEY);
    if (sessionJson) candidates.push(sessionJson);
    if (localJson && localJson !== sessionJson) candidates.push(localJson);
    return candidates;
  }
  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_KEY);
  }

  let currentPage = '';
  let refDataCache = null;
  let formState = { jenisAspirasi: null, bukti: null };
  let previousPage = 'beranda';
  let adminAspirasiCache = [];
  let adminSummaryCache = {};
  let homeClockTimer = null;
  let homeClockServerEpoch = null;
  let homeClockPerfBase = 0;
  let agendaCalendarYear = null;
  let agendaCalendarMonth = null;
  let agendaAdminTab = 'agenda';
  let agendaManagementCache = { agenda: [], proposals: [], pendingCount: 0 };
  let agendaCalendarHolidays = [];
  let agendaCalendarEvents = [];
  let agendaCalendarIsAdmin = false;

  // Indikator global untuk setiap RPC Google Apps Script. Semua pemanggilan
  // server dilewatkan melalui runServerWithLoader() agar operasi baca/tulis
  // memberi umpan balik yang konsisten tanpa mengubah handler tiap fitur.
  let serverRequestSequence = 0;
  const serverRequestEntries = Object.create(null);
  function refreshServerLoadingIndicator() {
    const indicator = document.getElementById('serverProcessIndicator');
    const label = document.getElementById('serverProcessLabel');
    if (!indicator || !label) return;
    const entries = Object.keys(serverRequestEntries).map(function (key) { return serverRequestEntries[key]; });
    const visible = entries.some(function (entry) { return entry.visible; });
    if (!entries.length || !visible) {
      indicator.classList.remove('is-visible');
      indicator.setAttribute('aria-hidden', 'true');
      return;
    }
    const writing = entries.some(function (entry) { return entry.writing; });
    label.textContent = entries.length > 1 ? 'Memproses permintaan…' : (entries[0].label || (writing ? 'Menyimpan perubahan…' : 'Memuat data…'));
    indicator.classList.add('is-visible');
    indicator.setAttribute('aria-hidden', 'false');
  }
  function finishServerRequest(id) {
    const entry = serverRequestEntries[id];
    if (!entry) return;
    clearTimeout(entry.showTimer);
    clearTimeout(entry.maxTimer);
    delete serverRequestEntries[id];
    refreshServerLoadingIndicator();
  }
  function beginServerRequest(methodName, labelOverride) {
    const id = ++serverRequestSequence;
    const writing = /^(register|request|save|submit|update|delete|remove|reset|toggle|mark|add|complete|set|upload|migrate|review|getSemuaAspirasi)/i.test(String(methodName || ''));
    const entry = { writing: writing, label: String(labelOverride || ''), visible: false, showTimer: null, maxTimer: null };
    serverRequestEntries[id] = entry;
    entry.showTimer = setTimeout(function () {
      if (!serverRequestEntries[id]) return;
      entry.visible = true;
      refreshServerLoadingIndicator();
    }, 160);
    // Jangan biarkan indikator tersangkut bila jaringan/layanan berhenti merespons.
    entry.maxTimer = setTimeout(function () { finishServerRequest(id); }, 120000);
    return function () { finishServerRequest(id); };
  }
  function beginClientProcess(label) { return beginServerRequest('clientProcess', label); }

  // v11: deteksi sesi yang sudah tidak berlaku. requireSession_ di server melempar
  // pesan berawalan "Sesi ..." atau "Hak Admin sudah dicabut"; sebagian endpoint
  // menangkapnya dan mengembalikan { success:false, message }. Keduanya ditangani.
  const EXPIRED_SESSION_PATTERN = /^(Sesi (tidak ditemukan|kedaluwarsa|telah dicabut|lama tidak lagi berlaku)|Hak Admin sudah dicabut)/;
  let expiredSessionHandled = false;
  function handleExpiredSessionResponse(value, isFailure) {
    if (!currentUser || expiredSessionHandled) return false;
    const message = isFailure
      ? String(value && value.message || value || '')
      : String(value && value.success === false && value.message || '');
    if (!EXPIRED_SESSION_PATTERN.test(message)) return false;
    expiredSessionHandled = true;
    clearInvalidSession();
    showAppDialog('Sesi Anda sudah berakhir. Silakan masuk kembali.', { type: 'error', title: 'Sesi berakhir' });
    setTimeout(function () { expiredSessionHandled = false; }, 1500);
    return true;
  }
  function runServerWithLoader() {
    let finishActiveRequest = null;
    let started = false;
    function finishActive() {
      if (!finishActiveRequest) return;
      const finish = finishActiveRequest;
      finishActiveRequest = null;
      finish();
    }
    function wrapRunner(runner) {
      return new Proxy(runner, {
        get: function (target, property) {
          const member = target[property];
          if (typeof property === 'symbol') return member;
          if (property === 'withSuccessHandler' || property === 'withFailureHandler') {
            const isFailure = property === 'withFailureHandler';
            return function () {
              const args = Array.prototype.slice.call(arguments);
              if (typeof args[0] === 'function') {
                const handler = args[0];
                args[0] = function (value) {
                  finishActive();
                  // v11: sesi habis di tengah pemakaian -> kembali ke layar login
                  // dengan pesan jelas, bukan pesan "gagal memuat" yang membingungkan.
                  if (handleExpiredSessionResponse(value, isFailure)) return;
                  return handler.apply(this, arguments);
                };
              }
              return wrapRunner(member.apply(target, args));
            };
          }
          if (property === 'withUserObject') {
            return function () { return wrapRunner(member.apply(target, arguments)); };
          }
          if (typeof member === 'function') {
            return function () {
              if (!started) {
                started = true;
                finishActiveRequest = beginServerRequest(String(property));
              }
              try { return member.apply(target, arguments); }
              catch (err) { finishActive(); throw err; }
            };
          }
          return member;
        }
      });
    }
    // Default callbacks ensure the loader also closes for calls that do not
    // define their own handler. User handlers are wrapped below and preserved.
    // v11: di aplikasi terpasang (APK/iPhone/PWA) google.script.run tidak ada;
    // TT2Remote (tt2-remote.js) menyediakan pengganti berbasis fetch ke doPost
    // dengan antarmuka yang sama, sehingga seluruh pemanggilan lain tidak berubah.
    const baseRunner = (window.TT2Remote && window.TT2Remote.enabled)
      ? window.TT2Remote.createRunner()
      : google.script.run;
    const runner = baseRunner
      .withSuccessHandler(function () { finishActive(); })
      .withFailureHandler(function (err) { finishActive(); console.error('Permintaan server gagal', err); });
    return wrapRunner(runner);
  }

  // ===================================================================
  // TERAPKAN TEMA CUSTOM (warna & background) DARI SYSTEMCONFIG
  // Dipanggil sekali di awal, sebelum apa pun lain dirender —
  // biar warna custom juga kepakai di layar login, bukan cuma di dalam app
  // ===================================================================
  function hexToRgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  // Campur warna dengan target (0 = hitam, 255 = putih); t = porsi target (0..1)
  function mixRgb(rgb, target, t) {
    return '#' + [rgb.r, rgb.g, rgb.b].map(function (v) {
      return ('0' + Math.round(v + (target - v) * t).toString(16)).slice(-2);
    }).join('');
  }
  // v14: rasio kontras WCAG antara warna dan putih.
  function contrastWithWhite(hex) {
    const c = hexToRgb(hex);
    const lin = [c.r, c.g, c.b].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    const L = 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
    return 1.05 / (L + 0.05);
  }
  // v14: gelapkan warna seperlunya sampai kontras dengan putih >= minRatio.
  // Dipakai agar teks hijau/biru tema dan teks putih di tombol selalu terbaca,
  // apa pun warna tema yang dipilih admin di Kelola Aplikasi.
  function darkenForContrast(rgb, minRatio, startAt) {
    for (let t = startAt || 0; t <= 0.9; t += 0.02) {
      const candidate = mixRgb(rgb, 0, t);
      if (contrastWithWhite(candidate) >= minRatio) return candidate;
    }
    return mixRgb(rgb, 0, 0.9);
  }
  function applyTheme() {
    if (!systemConfig) return;
    const root = document.documentElement.style;
    const rgb = hexToRgb(systemConfig.PrimaryColor);
    if (rgb) {
      const lum = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b) / 255;
      root.setProperty('--color-primary', mixRgb(rgb, 255, 0));
      // Teks berwarna tema (judul, label, tautan): minimal 5,2:1 di atas putih,
      // agar tetap >= 4,5:1 di atas latar pastel (tombol sekunder, kartu).
      root.setProperty('--color-primary-deep', darkenForContrast(rgb, 5.2, lum > 0.7 ? 0.5 : 0.25));
      // Latar tombol utama dengan teks putih: minimal 4,5:1.
      root.setProperty('--color-primary-strong', darkenForContrast(rgb, 4.5, 0));
      root.setProperty('--color-primary-soft', mixRgb(rgb, 255, 0.35));
      root.setProperty('--color-pastel-100', mixRgb(rgb, 255, 0.95));
      root.setProperty('--color-pastel-200', mixRgb(rgb, 255, 0.88));
      root.setProperty('--color-pastel-300', mixRgb(rgb, 255, 0.75));
    }
    const bg = String(systemConfig.BackgroundImage || '').trim();
    if (/^https:\/\/[^\s"'()<>\\]+$/i.test(bg)) root.setProperty('--bg-image', 'url("' + bg + '")');
    else root.removeProperty('--bg-image');
  }
  applyTheme();

  // ===================================================================
  // AUTH
  // ===================================================================
  function showAuthTab(tab) {
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('forgotPinForm').style.display = 'none';
  }

  function showForgotPinForm() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('forgotPinForm').style.display = 'block';
    document.getElementById('forgotUsername').focus();
  }

  function submitForgotPin() {
    const username = document.getElementById('forgotUsername').value.trim().toLowerCase();
    const btn = document.getElementById('btnForgotPin');
    const error = document.getElementById('forgotError');
    const success = document.getElementById('forgotSuccess');
    if (!/^[a-z0-9_]{3,80}$/.test(username)) {
      document.getElementById('forgotErrorText').innerText = 'Masukkan username yang valid.';
      error.style.display = 'flex'; success.style.display = 'none'; return;
    }
    btn.disabled = true; btn.innerText = 'Mengirim...'; error.style.display = 'none';
    runServerWithLoader()
      .withSuccessHandler(function (result) {
        btn.disabled = false; btn.innerText = 'Kirim Permintaan';
        if (!result.success) { document.getElementById('forgotErrorText').innerText = result.message; error.style.display = 'flex'; return; }
        document.getElementById('forgotSuccessText').innerText = result.message;
        success.style.display = 'flex';
      })
      .withFailureHandler(function () {
        btn.disabled = false; btn.innerText = 'Kirim Permintaan';
        document.getElementById('forgotErrorText').innerText = 'Permintaan tidak dapat diproses. Coba lagi.';
        error.style.display = 'flex';
      })
      .requestForgotPin({ username: username });
  }

  function validateUsername(input) {
    input.value = input.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
  }

  function onlyDigits(input) {
    input.value = input.value.replace(/[^0-9]/g, '');
  }

  // v15: kolom PIN memakai type="text" + inputmode="numeric" + penyamaran CSS,
  // karena di sebagian HP type="password" memunculkan keyboard huruf.
  // Peramban yang tidak mengenal penyamaran CSS kembali ke type="password".
  const PIN_MASK_SUPPORTED = !!(window.CSS && CSS.supports && CSS.supports('-webkit-text-security', 'disc'));
  function preparePinInputs(root) {
    if (PIN_MASK_SUPPORTED) return;
    (root || document).querySelectorAll('input.pin-input').forEach(function (input) { input.type = 'password'; });
  }
  document.addEventListener('DOMContentLoaded', function () { preparePinInputs(document); });
  function togglePinVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const hidden = PIN_MASK_SUPPORTED ? !input.classList.contains('pin-visible') : input.type === 'password';
    if (PIN_MASK_SUPPORTED) input.classList.toggle('pin-visible', hidden);
    else input.type = hidden ? 'text' : 'password';
    btn.innerText = hidden ? '🙈' : '👁️';
    btn.setAttribute('aria-label', hidden ? 'Sembunyikan PIN' : 'Tampilkan PIN');
  }

  function setupAuthKeyboard() {
    const loginUsername = document.getElementById('loginUsername');
    const loginPin = document.getElementById('loginPin');
    const regUsername = document.getElementById('regUsername');
    const regPin = document.getElementById('regPin');
    const regPinConfirm = document.getElementById('regPinConfirm');
    const forgotUsername = document.getElementById('forgotUsername');
    if (loginUsername) loginUsername.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') { event.preventDefault(); loginPin.focus(); }
    });
    if (loginPin) loginPin.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') { event.preventDefault(); loginWithPin(); }
    });
    if (regUsername) regUsername.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') { event.preventDefault(); regPin.focus(); }
    });
    if (regPin) regPin.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') { event.preventDefault(); regPinConfirm.focus(); }
    });
    if (regPinConfirm) regPinConfirm.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') { event.preventDefault(); registerUser(); }
    });
    if (forgotUsername) forgotUsername.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') { event.preventDefault(); submitForgotPin(); }
    });
  }

  function registerUser() {
    const username = document.getElementById('regUsername').value.trim();
    const pin = document.getElementById('regPin').value.trim();
    const pinConfirm = document.getElementById('regPinConfirm').value.trim();
    const btn = document.getElementById('btnRegister');
    const errorBox = document.getElementById('registerError');
    const errorText = document.getElementById('registerErrorText');
    const successBox = document.getElementById('registerSuccess');

    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    if (!username || !pin || !pinConfirm) {
      errorText.innerText = 'Semua field wajib diisi.';
      errorBox.style.display = 'flex';
      return;
    }
    btn.disabled = true;
    btn.innerText = 'Mendaftar...';

    runServerWithLoader()
      .withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.innerText = 'Daftar';
        if (!result.success) {
          errorText.innerText = result.message;
          errorBox.style.display = 'flex';
          return;
        }
        successBox.style.display = 'flex';
        document.getElementById('regUsername').value = '';
        document.getElementById('regPin').value = '';
        document.getElementById('regPinConfirm').value = '';
        setTimeout(function() {
          showAuthTab('login');
          document.getElementById('loginUsername').value = username;
          successBox.style.display = 'none';
        }, 2000);
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerText = 'Daftar';
        errorText.innerText = 'Terjadi kesalahan. Coba lagi.';
        errorBox.style.display = 'flex';
        console.error(err);
      })
      .registerUser({ username: username, pin: pin, pinConfirm: pinConfirm });
  }

  function loginWithPin() {
    const username = document.getElementById('loginUsername').value.trim().toLowerCase();
    const pin = document.getElementById('loginPin').value.trim();
    const btn = document.getElementById('btnLogin');
    const errorBox = document.getElementById('loginError');
    const errorText = document.getElementById('loginErrorText');

    if (!username || !pin) {
      errorText.innerText = 'Username dan PIN wajib diisi.';
      errorBox.style.display = 'flex';
      return;
    }
    btn.disabled = true;
    btn.innerText = 'Memuat...';
    errorBox.style.display = 'none';

    runServerWithLoader()
      .withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.innerText = 'Masuk';
        if (!result.success) {
          errorText.innerText = result.message;
          errorBox.style.display = 'flex';
          return;
        }
        currentUser = result.user;
        const remember = document.getElementById('loginRemember').checked;
        saveSession(currentUser, remember);
        if (!currentUser.profileComplete && !currentUser.isSuperAdmin) {
          showProfileScreen();
        } else {
          showMainScreen();
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerText = 'Masuk';
        errorText.innerText = 'Terjadi kesalahan. Coba lagi.';
        errorBox.style.display = 'flex';
        console.error(err);
      })
      // v11: remember dikirim ke server -> sesi 30 hari (dicentang) atau 6 jam.
      .loginWithPin({ username: username, pin: pin, remember: document.getElementById('loginRemember').checked });
  }

  function showProfileScreen() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('profileScreen').style.display = 'block';
    // v12: akun yang profilnya tidak dilengkapi dalam 7 hari dihapus otomatis.
    if (currentUser && currentUser.profileDeadline) {
      const deadlineText = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
        .format(new Date(currentUser.profileDeadline));
      showAppDialog('Lengkapi profil Anda paling lambat ' + deadlineText + '. Akun yang profilnya belum lengkap setelah 7 hari sejak mendaftar akan dihapus otomatis.',
        { title: 'Lengkapi profil' });
    }
    if (refDataCache) {
      populateProfStatusOptions();
    } else {
      runServerWithLoader()
        .withSuccessHandler(function (data) { refDataCache = data; populateProfStatusOptions(); })
        .withFailureHandler(function (err) { console.error(err); })
        .getRefData();
    }
  }

  function populateProfStatusOptions() {
    const select = document.getElementById('profStatus');
    select.innerHTML = '<option value="">-- Pilih --</option>' + buildOptions(refDataCache.Status_Wisma);
  }

  function onProfStatusChange() {
    const val = document.getElementById('profStatus').value;
    const show = (val === 'Penghuni BAST');
    document.getElementById('wrapProfFloorUnit').style.display = show ? 'grid' : 'none';
    if (show) populateFloorUnit8O('prof', document.getElementById('profLantai').value, '');
  }

  function saveProfile() {
    const nama = document.getElementById('profNama').value.trim();
    const wa = document.getElementById('profWA').value.trim();
    const status = document.getElementById('profStatus').value;
    const btn = document.getElementById('btnSaveProfile');
    const errorBox = document.getElementById('profileError');
    const errorText = document.getElementById('profileErrorText');

    if (!nama || !wa || !status) {
      errorText.innerText = 'Mohon lengkapi Nama, WhatsApp, dan Status di Wisma.';
      errorBox.style.display = 'flex';
      return;
    }
    let lantai = '', unit = '';
    if (status === 'Penghuni BAST') {
      lantai = document.getElementById('profLantai').value.trim();
      unit = fullUnit8O(lantai, document.getElementById('profUnitSuffix').value.trim());
      if (!lantai || !unit) {
        errorText.innerText = 'Mohon lengkapi Lantai dan Unit.';
        errorBox.style.display = 'flex';
        return;
      }
    }
    const waValid = /^(08[0-9]{8,11}|\+62[0-9]{8,11})$/.test(wa);
    if (!waValid) {
      errorText.innerText = 'Format WA harus diawali 08 atau +62.';
      errorBox.style.display = 'flex';
      return;
    }
    btn.disabled = true;
    btn.innerText = 'Menyimpan...';
    const payload = { username: currentUser.username, nama: nama, statusWisma: status, lantai: lantai, unit: unit, nomorWhatsApp: wa , sessionToken: currentUser.sessionToken };

    runServerWithLoader()
      .withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.innerText = 'Simpan Profil';
        if (!result.success) {
          errorText.innerText = result.message;
          errorBox.style.display = 'flex';
          return;
        }
        currentUser.name = nama;
        currentUser.statusWisma = status;
        currentUser.lantai = lantai;
        currentUser.unit = unit;
        currentUser.nomorWhatsApp = wa;
        currentUser.profileComplete = true;
        updateStoredSession(currentUser);
        showMainScreen();
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerText = 'Simpan Profil';
        errorText.innerText = 'Terjadi kesalahan. Coba lagi.';
        errorBox.style.display = 'flex';
        console.error(err);
      })
      .updateProfile(payload);
  }

  window.onload = function() {
    setupAuthKeyboard();
    const candidates = loadSessionCandidates();
    function tryRestoreSession(index) {
      if (index >= candidates.length) {
        clearInvalidSession();
        return;
      }
      try {
        currentUser = JSON.parse(candidates[index]);
        if (!currentUser || !currentUser.sessionToken) {
          tryRestoreSession(index + 1);
          return;
        }
        runServerWithLoader()
          .withSuccessHandler(function (result) {
            if (result && result.valid) {
              // Rehydrate role flags from the server so sessions created by an
              // older frontend cannot make SuperAdmin disappear after refresh.
              currentUser.isSuperAdmin = result.role === 'super_admin';
              currentUser.isAdmin = result.role === 'admin' || result.role === 'super_admin';
              updateStoredSession(currentUser);
              showMainScreen();
            } else {
              tryRestoreSession(index + 1);
            }
          })
          .withFailureHandler(function () { tryRestoreSession(index + 1); })
          .validateSession(currentUser.sessionToken);
      } catch(e) {
        tryRestoreSession(index + 1);
      }
    }
    if (candidates.length) tryRestoreSession(0);
    else document.getElementById('loginScreen').style.display = 'block';
  };

  function clearInvalidSession() {
    currentUser = null;
    clearSession();
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('profileScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPin').value = '';
    document.getElementById('loginError').style.display = 'none';
    showAuthTab('login');
  }

  function showMainScreen() {
    if (!currentUser || !currentUser.sessionToken) { clearInvalidSession(); return; }
    // v12: daftarkan perangkat untuk notifikasi push (hanya di aplikasi terpasang).
    if (window.TT2Shell && typeof window.TT2Shell.onSignedIn === 'function') {
      setTimeout(function () { window.TT2Shell.onSignedIn(currentUser); }, 600);
    }
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('profileScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'flex';
    setupNavigation();
    setupScrollHeader();
    navigateTo('beranda', { fromHistory: true });
    resetAppHistory('beranda');
  }

  function showAppDialog(message, options) {
    const old = document.getElementById('appDialogOverlay');
    if (old) old.remove();
    options = options || {};
    const overlay = document.createElement('div');
    overlay.id = 'appDialogOverlay';

  const appHistory = { enabled: !!(window.TT2Remote && window.TT2Remote.enabled), depth: 0 };
  const BACK_CLOSABLE_OVERLAYS = '#appDialogOverlay, .jelajah-modal-overlay, .agenda-modal-overlay, .kontak-modal-overlay, [data-back-close]';
  function closeTopOverlayForBack() {

  function resetAppHistory(page) {
    if (!appHistory.enabled) return;
    appHistory.depth = 0;
    try { history.replaceState({ tt2: true, page: page, depth: 0 }, ''); } catch (ignore) {}
  }
  function pushAppHistory(page) {
    if (!appHistory.enabled) return;
    appHistory.depth += 1;
    try { history.pushState({ tt2: true, page: page, depth: appHistory.depth }, ''); } catch (ignore) {}
  }
  if (appHistory.enabled) {
    window.addEventListener('popstate', function (event) {
      const state = event.state;
      if (!currentUser || !state || !state.tt2) return;
      if (closeTopOverlayForBack()) {
        // Popup ditutup; kembalikan entri halaman yang baru saja terpakai oleh Back.
        try { history.pushState({ tt2: true, page: currentPage, depth: appHistory.depth }, ''); } catch (ignore) {}
        return;
      }
      if (appHistory.depth === 0 && currentPage === 'beranda') {
        // Sudah di Beranda: entri lama (mis. dari sesi sebelum logout) diabaikan dan aplikasi ditutup.
        if (window.TT2Shell && typeof window.TT2Shell.exitApp === 'function') window.TT2Shell.exitApp();
        else resetAppHistory('beranda');
        return;

      appHistory.depth = Number(state.depth) || 0;

  function floorOptions8O(selected) {

  function splitFloorUnit8O(floor, unit) {
    const f = String(floor || '').trim();
    const u = String(unit || '').trim().replace(/[-/\s]/g, '');
    if (/^\d{4}$/.test(u)) return { floor: u.substring(0, 2), suffix: u.substring(2) };
    if (/^\d{3}$/.test(u)) {
      const inferredFloor = ('0' + u.substring(0, 1)).slice(-2);
      return { floor: /^\d{1,2}$/.test(f) ? ('0' + parseInt(f, 10)).slice(-2) : inferredFloor, suffix: u.substring(1) };
    }
    return { floor: /^\d{1,2}$/.test(f) ? ('0' + parseInt(f, 10)).slice(-2) : '', suffix: /^\d{1,2}$/.test(u) ? ('0' + parseInt(u, 10)).slice(-2) : '' };
  }
  function fullUnit8O(prefix, suffix) {

    if (!floorEl || !suffixEl || !prefixEl) return;

  // Centralized escaping for values that originate in Sheets or user input.
  function escapeHtml(value) {

      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function escapeAttr(value) { return escapeHtml(value); }
  // Hanya terima URL https:// murni (tanpa spasi/kutip). Dipakai untuk href
  // yang nilainya berasal dari Sheet (foto bukti/tindak lanjut), supaya
  // escaping saja tidak jadi satu-satunya lapisan pertahanan terhadap skema
  // berbahaya seperti javascript:.
  function safeHttpUrl(url) {

    return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : '';
  }
  function csvCell(value) {
    let text = String(value == null ? '' : value);
    // Cegah CSV/Formula Injection: teks bebas (nama, detail aspirasi, catatan)
    // yang diawali =, +, -, @, atau tab/CR bisa dibaca sebagai rumus oleh
    // Excel/Google Sheets saat file CSV ini dibuka. Beri awalan kutip supaya
    // selalu dibaca sebagai teks biasa.
    if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;
    return /[",\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  }

  function stopBannerAutoplay() {

  var BANNER_INTERVAL = 2000; // jeda antar banner, dalam milidetik

  function initBannerCarousel() {
    stopBannerAutoplay();
    const track = document.getElementById('bannerTrack');
    if (!track) return;
    const dots = document.querySelectorAll('#bannerDots .banner-dot');
    const total = track.children.length;
    if (total < 2) return;

    let holding = false;   // true selama banner ditahan
    let resumeAt = 0;      // jeda singkat setelah dilepas

    function currentIndex() { return Math.round(track.scrollLeft / Math.max(track.clientWidth, 1)); }

    track.addEventListener('scroll', function () {
      const i = currentIndex();
      dots.forEach(function (d, k) { d.classList.toggle('active', k === i); });
    }, { passive: true });

    function hold() { holding = true; }
    function release() { holding = false; resumeAt = Date.now() + 1500; }
    track.addEventListener('touchstart', hold, { passive: true });
    track.addEventListener('touchend', release, { passive: true });
    track.addEventListener('touchcancel', release, { passive: true });
    track.addEventListener('mouseenter', hold);
    track.addEventListener('mouseleave', release);

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    bannerTimer = setInterval(function () {
      if (!document.getElementById('bannerTrack')) { stopBannerAutoplay(); return; }
      if (holding || Date.now() < resumeAt) return;
      const next = (currentIndex() + 1) % total;
      track.scrollTo({ left: next * track.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' });
    }, BANNER_INTERVAL);
  }

        script.onload = function () { resolve(); };
        script.onerror = function () { leafletLoading = null; reject(new Error('Peta tidak dapat dimuat. Periksa koneksi internet.')); };
        document.head.appendChild(script);

  function createJelajahMap(element, center, zoom, interactive) {
    const map = L.map(element, { zoomControl: interactive, dragging: interactive, scrollWheelZoom: false, doubleClickZoom: interactive, touchZoom: interactive, boxZoom: false, keyboard: interactive, tap: interactive, attributionControl: true });
    map.setView([center.lat, center.lng], zoom);
    if (map.attributionControl) map.attributionControl.setPrefix(false);
    let fallback = false;
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    let errors = 0;
    osm.on('tileerror', function () {
      if (fallback || ++errors < 3) return;
      fallback = true; map.removeLayer(osm);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd', attribution: '© OpenStreetMap © CARTO' }).addTo(map);

    return map;

  // ---------- Hitungan bantu ----------
  function jelajahDistanceMeters(item) {
    if (!jelajahTower || item == null || item.lat == null || item.lng == null) return null;
    const R = 6371000, r = Math.PI / 180;
    const dLat = (item.lat - jelajahTower.lat) * r, dLng = (item.lng - jelajahTower.lng) * r;
    const h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(jelajahTower.lat * r) * Math.cos(item.lat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function jelajahDistanceText(item) {
    const m = jelajahDistanceMeters(item);
    if (m == null) return '';
    return m < 1000 ? (Math.round(m / 10) * 10) + ' m' : (Math.round(m / 100) / 10).toString().replace('.', ',') + ' km';
  }

  function closeJelajahModal() { const overlay = document.getElementById('jelajahModalOverlay'); if (overlay) overlay.remove(); }

  function jelajahDuplicateOf(name, lat, lng, ignoreId) {
    const n = jelajahNormalize(name); if (n.length < 3) return null;
    return jelajahRecommendations.filter(function (r) {
      if (r.id === ignoreId) return false;
      const rn = jelajahNormalize(r.namaLokasi);
      const sameName = rn === n || (n.length >= 5 && (rn.indexOf(n) >= 0 || n.indexOf(rn) >= 0));
      if (!sameName) return false;
      if (lat == null || r.lat == null) return true;
      const R = 6371000, k = Math.PI / 180;
      const dLat = (r.lat - lat) * k, dLng = (r.lng - lng) * k;
      const h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat * k) * Math.cos(r.lat * k) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.sqrt(h)) < 300;
    })[0] || null;
  }

  function submitJelajahDraft() {

  function stopHomeClock() {
    if (homeClockTimer) clearInterval(homeClockTimer);
    homeClockTimer = null;
  }
  function homeClockNow() {
    if (homeClockServerEpoch !== null) {
      const perfNow = window.performance && typeof window.performance.now === 'function' ? window.performance.now() : Date.now();
      return new Date(homeClockServerEpoch + (perfNow - homeClockPerfBase));
    }
    return new Date();
  }
  function updateHomeClock() {
    const node = document.getElementById('homeClockDate');
    if (!node) { stopHomeClock(); return; }
    const now = homeClockNow();
    try {
      const date = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
      const time = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(now);
      node.textContent = date + ' · ' + time + ' WIB';
    } catch (err) { node.textContent = now.toLocaleString('id-ID'); }
  }
  function startHomeClock() {
    stopHomeClock();
    homeClockServerEpoch = null;
    updateHomeClock();
    homeClockTimer = setInterval(updateHomeClock, 1000);
    runServerWithLoader()
      .withSuccessHandler(function (result) {
        if (currentPage !== 'beranda' || !result || !Number(result.epochMs)) return;
        homeClockServerEpoch = Number(result.epochMs);
        homeClockPerfBase = window.performance && typeof window.performance.now === 'function' ? window.performance.now() : Date.now();
        updateHomeClock();
      })
      .withFailureHandler(function (err) { console.warn('Waktu server tidak tersedia; memakai jam perangkat.', err); })
      .getAppClock(currentUser.sessionToken);
  }

  function loadAgendaCalendar(year, month) {
    runServerWithLoader()
      .withSuccessHandler(function (result) {
        if (currentPage !== 'kalenderKerja') return;
        if (!result || !result.success) { document.getElementById('pageContent').innerHTML = getTopBar('Kalender Kerja') + '<div class="empty-state">Kalender belum dapat dimuat.</div>' + getCopyrightFooter(); return; }
        agendaCalendarYear = Number(result.year);
        agendaCalendarMonth = Number(result.month);
        agendaCalendarEvents = result.events || [];
        agendaCalendarIsAdmin = !!result.isAdmin;
        renderAgendaCalendar(result);
      })
      .withFailureHandler(function (err) {
        if (currentPage !== 'kalenderKerja') return;
        document.getElementById('pageContent').innerHTML = getTopBar('Kalender Kerja') + '<div class="empty-state">Gagal memuat kalender. Coba lagi.</div>' + getCopyrightFooter();
        console.error('Kalender Kerja gagal dimuat', err);
      })
      .getAgendaCalendar(currentUser.sessionToken, year, month);
  }
  function changeAgendaMonth(delta) {
    if (!agendaCalendarYear || !agendaCalendarMonth) return;
    const next = new Date(Date.UTC(agendaCalendarYear, agendaCalendarMonth - 1 + delta, 1));
    loadAgendaCalendar(next.getUTCFullYear(), next.getUTCMonth() + 1);
  }
  function renderAgendaCalendar(result) {
    const year = Number(result.year), month = Number(result.month);
    const monthTitle = new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(Date.UTC(year, month - 1, 1, 12)));
    const firstDay = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
    const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
    const weekdays = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
    agendaCalendarHolidays = Array.isArray(result.holidays) ? result.holidays : [];
    let cells = '<div class="agenda-calendar-empty" aria-hidden="true"></div>'.repeat(firstDay);
    for (let day = 1; day <= daysInMonth; day++) {
      const dateKey = String(year) + '-' + ('0' + month).slice(-2) + '-' + ('0' + day).slice(-2);
      const events = agendaCalendarEvents.filter(function (event) { return event.date === dateKey; });
      const activeCount = events.filter(function (event) { return event.active; }).length;
      const dayHolidays = agendaCalendarHolidays.filter(function (item) { return item.date === dateKey; });
      const libur = dayHolidays.filter(function (item) { return item.type === 'libur'; })[0];
      const peringatan = dayHolidays.filter(function (item) { return item.type === 'peringatan'; })[0];
      const internasional = dayHolidays.filter(function (item) { return item.type === 'internasional'; })[0];
      const weekday = (firstDay + day - 1) % 7;
      const todayClass = result.serverToday === dateKey ? ' is-today' : '';
      const eventClass = events.length ? ' has-agenda' : '';
      const dayClass = libur || weekday === 0 ? ' is-holiday' : (weekday === 6 ? ' is-saturday' : '');
      const dateArg = escapeAttr(JSON.stringify(dateKey));
      const labelParts = [day + ' ' + monthTitle];
      if (libur) labelParts.push('libur: ' + libur.name);
      if (peringatan) labelParts.push(peringatan.name);
      if (internasional) labelParts.push(internasional.name);
      if (events.length) labelParts.push(events.length + ' agenda');
      cells += '<button type="button" class="agenda-day' + todayClass + eventClass + dayClass + '" onclick="openAgendaDate(' + dateArg + ')" aria-label="' + escapeAttr(labelParts.join(', ')) + '">' +
        '<span class="agenda-day-number">' + day + (peringatan && !libur ? '<i class="agenda-day-dot" aria-hidden="true"></i>' : '') + (internasional && !libur ? '<i class="agenda-day-dot is-intl" aria-hidden="true"></i>' : '') + '</span>' +
        (libur ? '<span class="agenda-day-holiday">' + escapeHtml(libur.name) + '</span>' : '') +
        (events.length ? '<span class="agenda-day-count">' + (activeCount ? activeCount + ' agenda' : 'arsip') + '</span>' : '') +
      '</button>';
    }
    const monthHasAgenda = agendaCalendarEvents.some(function (event) { return event.active; });
    let html = getTopBar('Kalender Kerja') + '<div class="agenda-calendar-page">' +
      '<div class="agenda-calendar-heading"><div><h1>Kalender Kerja Tower 2</h1></div>' +
      (agendaCalendarIsAdmin ? '<button type="button" class="btn-primary agenda-add-button" onclick="navigateTo(\'kelolaAgenda\')">Kelola Agenda</button>' : '<button type="button" class="btn-primary agenda-add-button" onclick="openAgendaProposalForm(\'\')">+ Usulkan agenda</button>') + '</div>' +
      '<div class="agenda-month-nav"><button type="button" class="btn-small" onclick="changeAgendaMonth(-1)" aria-label="Bulan sebelumnya">←</button><h2>' + escapeHtml(monthTitle) + '</h2><button type="button" class="btn-small" onclick="changeAgendaMonth(1)" aria-label="Bulan berikutnya">→</button></div>' +
      '<div class="agenda-calendar-grid agenda-weekdays">' + weekdays.map(function (day, index) { return '<div' + (index === 0 ? ' class="is-holiday"' : index === 6 ? ' class="is-saturday"' : '') + '>' + day + '</div>'; }).join('') + '</div>' +
      '<div class="agenda-calendar-grid agenda-days">' + cells + '</div>' +
      (monthHasAgenda ? '' : '<p class="agenda-month-empty">Tidak ada agenda bulan ini</p>') +
      agendaMonthNotesHTML() +
      '</div>' + getCopyrightFooter();
    document.getElementById('pageContent').innerHTML = html;
  }

    const proposal = agendaManagementCache.proposals.find(function (item) { return String(item.id) === String(id); });
    if (!proposal) { showAppNotice('Usulan agenda tidak ditemukan.', 'error'); return; }
    showAppConfirm('Setujui “' + proposal.title + '” dan tampilkan di Kalender?', function () { submitAgendaProposalReview(id, 'approve', ''); }, 'Setujui');
  }
  function openAgendaRejectForm(id) {
    const proposal = agendaManagementCache.proposals.find(function (item) { return String(item.id) === String(id); });
    if (!proposal) { showAppNotice('Usulan agenda tidak ditemukan.', 'error'); return; }
    closeAgendaModal();
    const idArg = escapeAttr(JSON.stringify(String(id)));
    const overlay = document.createElement('div'); overlay.id = 'agendaModalOverlay'; overlay.className = 'agenda-modal-overlay';
    overlay.onclick = function (event) { if (event.target === overlay) closeAgendaModal(); };
    overlay.innerHTML = '<section class="agenda-modal" role="dialog" aria-modal="true" aria-labelledby="agendaRejectTitle"><header class="agenda-modal-header"><div><h2 id="agendaRejectTitle">Tolak usulan agenda</h2><p>' + escapeHtml(proposal.title) + '</p></div><button type="button" class="agenda-modal-close" onclick="closeAgendaModal()" aria-label="Tutup">×</button></header><div class="agenda-modal-content"><div class="field"><label for="agendaReviewNote">Alasan penolakan (opsional)</label><textarea id="agendaReviewNote" maxlength="500" placeholder="Catatan untuk arsip Admin"></textarea></div><button type="button" class="btn-primary agenda-reject-button" id="agendaRejectSubmitButton" onclick="submitAgendaProposalReview(' + idArg + ',\'reject\')">Tolak usulan</button></div></section>';
    document.body.appendChild(overlay);
  }
  function submitAgendaProposalReview(id, decision, note) {
    const reviewNote = note === undefined ? ((document.getElementById('agendaReviewNote') || {}).value || '') : note;
    const button = document.getElementById(decision === 'reject' ? 'agendaRejectSubmitButton' : 'agendaApproveSubmitButton');
    if (button) { button.disabled = true; button.textContent = decision === 'approve' ? 'Menyetujui…' : 'Menolak…'; }
    runServerWithLoader()
      .withSuccessHandler(function (result) {
        if (!result || !result.success) { if (button) { button.disabled = false; button.textContent = 'Tolak usulan'; } showAppNotice((result && result.message) || 'Usulan belum diperbarui.', 'error'); return; }
        closeAgendaModal(); showAppNotice(result.message); loadAgendaManagementData();
      })
      .withFailureHandler(function (err) { if (button) { button.disabled = false; button.textContent = 'Tolak usulan'; } showAppNotice('Pemeriksaan usulan gagal: ' + (err.message || 'coba lagi.'), 'error'); })
      .reviewAgendaProposal({ id: id, decision: decision, note: reviewNote, sessionToken: currentUser.sessionToken });
  }

  function getKepuasanColor(skor) {
    const skala5 = skor / 20;
    // v14: token status yang lolos kontras (sebelumnya #27ae60/#f39c12/#e74c3c, 2,2–3,8:1)
    if (skala5 >= 4) return 'var(--color-success)'; // hijau
    if (skala5 >= 3) return 'var(--color-warning)'; // kuning
    return 'var(--color-danger)'; // merah
  }

  function getKepuasanLabel(skor) {
    const skala5 = skor / 20;
    if (skala5 >= 4.5) return 'Sangat Puas';
    if (skala5 >= 3.5) return 'Puas';
    if (skala5 >= 2.5) return 'Cukup';
    if (skala5 >= 1.5) return 'Kurang Puas';
    return 'Sangat Kurang Puas';
  }

    rows.forEach(function(row) {
      const rowBulan = row.getAttribute('data-bulan');
      const rowKategori = row.getAttribute('data-kategori');
      let show = true;
      if (bulan !== 'all' && rowBulan) {
        const bulanMap = {'Januari':'01','Februari':'02','Maret':'03','April':'04','Mei':'05','Juni':'06',
          'Juli':'07','Agustus':'08','September':'09','Oktober':'10','November':'11','Desember':'12'};

      }
      if (kategori !== 'all' && rowKategori !== kategori) show = false;
      row.style.display = show ? '' : 'none';
    });
  }

  function onStatusChange() {
    const val = document.getElementById('f_status').value;
    const show = (val === 'Penghuni BAST');
    document.getElementById('wrap_lantai').style.display = show ? 'block' : 'none';
    document.getElementById('wrap_unit').style.display = show ? 'block' : 'none';
  }

  function onJenisClick(el) {
    const allJenis = document.querySelectorAll('[data-value="Masukan"], [data-value="Kritik"], [data-value="Pengaduan"]');
    allJenis.forEach(function (opt) { opt.classList.remove('selected'); });
    el.classList.add('selected');
    formState.jenisAspirasi = el.dataset.value;
    document.getElementById('wrap_kategori').style.display = 'block';
    document.getElementById('wrap_lokasi_masalah').style.display = 'block';
    document.getElementById('wrap_detail').style.display = 'block';
    document.getElementById('wrap_swadaya').style.display = 'block';
    document.getElementById('wrap_bukti').style.display = (formState.jenisAspirasi === 'Pengaduan') ? 'block' : 'none';
    document.getElementById('wrap_prioritas').style.display = (formState.jenisAspirasi === 'Pengaduan') ? 'block' : 'none';
    document.getElementById('lokasiMasalahRequired').textContent = formState.jenisAspirasi === 'Pengaduan' ? 'Wajib untuk Pengaduan' : 'Opsional untuk Masukan/Kritik';
    document.getElementById('lokasiMasalahRequired').classList.toggle('is-required', formState.jenisAspirasi === 'Pengaduan');
    if (formState.jenisAspirasi !== 'Pengaduan') document.getElementById('f_prioritas').value = '';
  }

  function onIssueLocationChange() {
    const type = document.getElementById('f_lokasi_masalah').value;
    const detail = document.getElementById('f_lokasi_masalah_detail');
    if (detail) detail.placeholder = type === 'Lantai' ? 'Contoh: lantai 12' : type === 'Unit' ? 'Contoh: unit 1205' : type === 'Area umum' ? 'Contoh: lift, lobby, koridor, parkir' : 'Bila diketahui, tulis rincian lokasi';
  }

  function onSwadayaClick(el) {
    document.querySelectorAll('#wrap_swadaya .radio-option').forEach(function (opt) { opt.classList.remove('selected'); });
    el.classList.add('selected');
    document.getElementById('f_swadaya').value = el.dataset.value;
  }

  function onFileSelected(event) {
    const file = event.target.files[0];
    if (!file) { formState.bukti = null; return; }
    const finish = beginClientProcess('Menyiapkan foto bukti…');
    let completed = false;
    const finishOnce = function () { if (!completed) { completed = true; finish(); } };
    const reader = new FileReader();
    reader.onload = function (e) {
      try {
        formState.bukti = { base64: e.target.result.split(',')[1], mimeType: file.type, fileName: file.name };
        document.getElementById('buktiPreview').innerHTML = '<img src="' + e.target.result + '" style="max-width:100%;border-radius:8px;margin-top:8px;">';
      } catch (err) { showAppNotice('Foto bukti tidak dapat disiapkan.'); }
      finally { finishOnce(); }
    };
    reader.onerror = function () { finishOnce(); showAppNotice('File foto bukti tidak dapat dibaca.'); };
    try { reader.readAsDataURL(file); } catch (err) { finishOnce(); showAppNotice('File foto bukti tidak dapat dibaca.'); }
  }

  function submitForm() {
    const nama = document.getElementById('f_nama').value.trim();
    const status = document.getElementById('f_status').value;
    const wa = document.getElementById('f_wa').value.trim();
    const jenis = formState.jenisAspirasi;
    if (!nama || !status || !wa || !jenis) {
      showAppNotice('Mohon lengkapi Nama, Status di Wisma, Nomor WhatsApp, dan Jenis Aspirasi.');
      return;
    }
    let lantai = '', unit = '';
    if (status === 'Penghuni BAST') {
      lantai = document.getElementById('f_lantai').value;
      unit = document.getElementById('f_unit').value;
      if (!lantai || !unit) { showAppNotice('Mohon lengkapi Lantai dan Unit.'); return; }
    }
    const waValid = /^(08[0-9]{8,11}|\+62[0-9]{8,11})$/.test(wa);
    if (!waValid) { showAppNotice('Format Nomor WhatsApp harus diawali 08 atau +62.'); return; }
    const kategori = document.getElementById('f_kategori').value;
    const detail = document.getElementById('f_detail').value.trim();
    if (!kategori || !detail) { showAppNotice('Mohon lengkapi Kategori dan Detail Aspirasi.'); return; }
    const lokasiMasalah = document.getElementById('f_lokasi_masalah').value;
    const lokasiMasalahDetail = document.getElementById('f_lokasi_masalah_detail').value.trim();
    if (jenis === 'Pengaduan' && !lokasiMasalah) { showAppNotice('Mohon pilih jenis lokasi masalah atau pilih Tidak diketahui.'); return; }
    if (lokasiMasalahDetail.length > 160) { showAppNotice('Rincian lokasi masalah maksimal 160 karakter.'); return; }
    if (lokasiMasalahDetail && !lokasiMasalah) { showAppNotice('Pilih jenis lokasi masalah sebelum mengisi rincian lokasi.'); return; }
    const prioritas = document.getElementById('f_prioritas').value;
    if (jenis === 'Pengaduan' && !prioritas) { showAppNotice('Mohon pilih Prioritas Pengaduan.'); return; }
    const kesediaanSwadaya = document.getElementById('f_swadaya').value;
    if (!kesediaanSwadaya) { showAppNotice('Mohon pilih Kesediaan Swadaya (Ya/Tidak).'); return; }

    const payload = {
      username: currentUser.username, nama: nama, statusWisma: status,
      lantai: lantai, unit: unit, nomorWhatsApp: wa,
      jenisAspirasi: jenis, kategori: kategori, detailAspirasi: detail,
      lokasiMasalah: lokasiMasalah, lokasiMasalahDetail: lokasiMasalahDetail,
      bukti: formState.bukti, kesediaanSwadaya: kesediaanSwadaya, prioritas: prioritas,
      sessionToken: currentUser.sessionToken
    };
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true; btn.innerText = 'Menyimpan...';

    runServerWithLoader()
      .withSuccessHandler(onSubmitSuccess)
      .withFailureHandler(function (err) { showAppNotice('Gagal menyimpan: ' + err.message); btn.disabled = false; btn.innerText = 'Simpan'; })
      .submitAspirasi(payload);
  }

  function onSubmitSuccess(result) {
    if (!result.success) { showAppNotice('Gagal menyimpan: ' + result.message); document.getElementById('btnSubmit').disabled = false; document.getElementById('btnSubmit').innerText = 'Simpan'; return; }
    showAppNotice('Terima kasih atas aspirasi yang diberikan. Seluruh aspirasi akan ditindaklanjuti dengan memegang teguh prinsip kerahasiaan data dan informasi.');
    buildFormHTML();
  }

  function saveAspirasiPublik(id) {
    const val = function (prefix) { const el = document.getElementById(prefix + id); return el ? (el.type === 'checkbox' ? el.checked : el.value.trim()) : ''; };
    const publik = val('papanPublik_');
    if (publik && !val('papanCek_')) { showAppNotice('Centang konfirmasi privasi dulu.', 'error'); return; }
    runServerWithLoader()
      .withSuccessHandler(function (result) {
        if (!result || !result.success) { showAppNotice((result && result.message) || 'Belum tersimpan.', 'error'); if (result && result.notFound) renderAdminDashboard(); return; }
        showAppNotice(result.message);
        const cached = (adminAspirasiCache || []).find(function (x) { return String(x.id) === String(id); });
        if (cached) { cached.publik = !!publik; cached.judulPublik = val('papanJudul_'); cached.lokasiPublik = val('papanLokasi_'); cached.catatanPublik = val('papanCatatan_'); }
        const summary = document.querySelector('.admin-aspirasi-card[data-aspirasi-id="' + cssEscapeValue(id) + '"] .papan-admin summary strong');
        if (summary) summary.textContent = publik ? 'Tampil ke warga' : 'Tidak tampil';
      })
      .withFailureHandler(function (err) { showAppNotice('Belum tersimpan: ' + (err && err.message || err), 'error'); })
      .setAspirasiPublik({ sessionToken: currentUser.sessionToken, id: id, publik: !!publik, judul: val('papanJudul_'), lokasi: val('papanLokasi_'), catatan: val('papanCatatan_'), konfirmasiPrivasi: !!val('papanCek_') });
  }

  function papanStepsHTML(step, rejected) {
    let html = '<ol class="papan-steps" aria-label="Tahap ' + step + ' dari 4">';
    for (let i = 1; i <= 4; i++) html += '<li class="' + (i <= step ? (rejected && i === 4 ? 'is-rejected' : (step === 4 ? 'is-done' : 'is-on')) : '') + '"></li>';
    return html + '</ol>';
  }

  function renderPapanTindakLanjut() {
    const started = currentPage;
    document.getElementById('pageContent').innerHTML = getTopBar('Papan Tindak Lanjut') + '<div class="page-title">Papan Tindak Lanjut</div><div class="spinner">Memuat…</div>';
    runServerWithLoader()
      .withSuccessHandler(function (result) {
        if (currentPage !== started) return;
        papanData = result && result.success ? result : { stats: {}, items: [] };
        paintPapan();
      })
      .withFailureHandler(function (err) { if (currentPage === started) document.getElementById('pageContent').innerHTML = getTopBar('Papan Tindak Lanjut') + '<div class="empty-state">Gagal memuat: ' + escapeHtml(err && err.message || err) + '</div>'; })
      .getPapanTindakLanjut(currentUser.sessionToken);
  }

  function setPapanFilter(value) { papanFilter = value; paintPapan(); }

  function paintPapan() {
    const d = papanData || { stats: {}, items: [] };
    const st = d.stats || {};
    const tanggap = st.rataTanggapJam == null ? '–' : (st.rataTanggapJam >= 48 ? (Math.round(st.rataTanggapJam / 2.4) / 10).toString().replace('.', ',') + ' hari' : String(st.rataTanggapJam).replace('.', ',') + ' jam');
    const items = (d.items || []).filter(function (it) {
      if (papanFilter === 'ditangani') return it.step < 4;
      if (papanFilter === 'selesai') return it.step === 4;
      return true;
    });
    const tabs = [['semua', 'Semua'], ['ditangani', 'Ditangani'], ['selesai', 'Selesai']];
    let html = getTopBar('Papan Tindak Lanjut') + '<div class="page-title">Papan Tindak Lanjut</div>' +
      '<p class="page-subtitle">Perkembangan aspirasi tentang fasilitas bersama. Nama dan unit pelapor tidak pernah ditampilkan.</p>' +
      '<section class="papan-stats" aria-label="Ringkasan bulan ini"><div class="papan-stats-head"><strong>Bulan ini</strong><span>' + escapeHtml(d.bulan || '') + '</span></div>' +
      '<div class="papan-stats-grid"><div><b>' + (Number(st.masuk) || 0) + '</b><span>Masuk</span></div><div class="is-warn"><b>' + (Number(st.ditangani) || 0) + '</b><span>Ditangani</span></div><div class="is-ok"><b>' + (Number(st.selesai) || 0) + '</b><span>Selesai</span></div></div>' +
      '<p>Rata-rata pertama ditanggapi pengurus: <strong>' + escapeHtml(tanggap) + '</strong></p></section>' +
      '<div class="notif-history-tabs" role="tablist" aria-label="Saring status">' + tabs.map(function (t) {
        return '<button type="button" role="tab" aria-selected="' + (papanFilter === t[0]) + '" class="' + (papanFilter === t[0] ? 'active' : '') + '" onclick="setPapanFilter(' + escapeAttr(JSON.stringify(t[0])) + ')">' + t[1] + '</button>';
      }).join('') + '</div>';
    if (!items.length) html += '<div class="empty-state">Belum ada aspirasi yang ditampilkan pada kelompok ini.</div>';
    else html += '<div class="papan-list">' + items.map(papanCardHTML).join('') + '</div>';
    html += getCopyrightFooter();
    document.getElementById('pageContent').innerHTML = html;
  }

  function togglePapanSupport(id) {
    runServerWithLoader()
      .withSuccessHandler(function (result) {
        if (!result || !result.success) { showAppNotice((result && result.message) || 'Gagal.', 'error'); return; }
        const it = papanData && (papanData.items || []).find(function (x) { return String(x.id) === String(id); });
        if (it) { it.didukung = result.didukung; it.dukungan = result.dukungan; }

      .withFailureHandler(function (err) { showAppNotice('Gagal: ' + (err && err.message || err), 'error'); })
      .toggleAspirasiDukungan({ sessionToken: currentUser.sessionToken, id: id });

  function normalizeWhatsAppNumber(number) {
    const raw = String(number == null ? '' : number).trim();
    // Do not treat a privacy-masked display value (e.g. 877••••829) as a phone.
    if (!raw || /[•●*xX]/.test(raw)) return '';
    let digits = raw.replace(/\D/g, '');
    if (digits.indexOf('00') === 0) digits = digits.substring(2);
    if (digits.indexOf('0') === 0) digits = '62' + digits.substring(1);
    else if (digits.indexOf('62') !== 0 && digits.indexOf('8') === 0) digits = '62' + digits;
    if (!/^62[0-9]{8,11}$/.test(digits)) return '';
    return digits;
  }
  function buildWaLink(nomor) {

    return normalized ? 'https://wa.me/' + normalized : '';

  function onFotoTLSelected(event, id) {
    const file = event.target.files[0];
    if (!file) { delete fotoTindakLanjutState[id]; return; }
    const finish = beginClientProcess('Menyiapkan foto tindak lanjut…');
    let completed = false;
    const finishOnce = function () { if (!completed) { completed = true; finish(); } };
    const reader = new FileReader();
    reader.onload = function (e) {
      try { fotoTindakLanjutState[id] = { base64: e.target.result.split(',')[1], mimeType: file.type, fileName: file.name }; }
      catch (err) { showAppNotice('Foto tindak lanjut tidak dapat disiapkan.'); }
      finally { finishOnce(); }
    };
    reader.onerror = function () { finishOnce(); showAppNotice('File foto tindak lanjut tidak dapat dibaca.'); };
    try { reader.readAsDataURL(file); } catch (err) { finishOnce(); showAppNotice('File foto tindak lanjut tidak dapat dibaca.'); }

  function adminItemMatches(item, filters) {
    const searchText = [item.id, item.nama, item.statusWisma, item.lantai, item.unit, item.jenisAspirasi, item.kategori, item.detailAspirasi, item.lokasiMasalah, item.lokasiMasalahDetail].join(' ').toLowerCase();

    const secondaryMatch = adminSecondaryTab === 'all' || (adminJenisTab === 'Pengaduan' ? (item.prioritas || 'Normal') === adminSecondaryTab : (item.statusAspirasi || 'Dibaca') === adminSecondaryTab);
    return typeMatch && secondaryMatch && (!filters.search || searchText.indexOf(filters.search) >= 0) &&
      (filters.status === 'all' || (item.statusAspirasi || 'Dibaca') === filters.status) &&
      (filters.jenis === 'all' || item.jenisAspirasi === filters.jenis) &&
      (filters.kategori === 'all' || item.kategori === filters.kategori) &&
      (filters.prioritas === 'all' || (item.prioritas || 'Normal') === filters.prioritas) &&
      (!filters.dateFrom || (item.tanggalISO || '') >= filters.dateFrom) &&
      (!filters.dateTo || (item.tanggalISO || '') <= filters.dateTo);

  function filterAdminAspirasi() {
    const filters = getAdminFilterValues();
    const cards = document.querySelectorAll('.admin-aspirasi-card');
    let visible = 0;
    cards.forEach(function (card) {
      const typeMatch = adminJenisTab === 'all' || card.dataset.jenis === adminJenisTab;
      const secondaryMatch = adminSecondaryTab === 'all' || (adminJenisTab === 'Pengaduan' ? card.dataset.prioritas === adminSecondaryTab : card.dataset.status === adminSecondaryTab);
      const show = typeMatch && secondaryMatch && (!filters.search || (card.dataset.search || '').toLowerCase().indexOf(filters.search) >= 0) &&
        (filters.status === 'all' || card.dataset.status === filters.status) &&
        (filters.jenis === 'all' || card.dataset.jenis === filters.jenis) &&
        (filters.kategori === 'all' || card.dataset.kategori === filters.kategori) &&
        (filters.prioritas === 'all' || card.dataset.prioritas === filters.prioritas) &&
        (!filters.dateFrom || (card.dataset.tanggal || '') >= filters.dateFrom) &&
        (!filters.dateTo || (card.dataset.tanggal || '') <= filters.dateTo);
      card.style.display = show ? '' : 'none';

  function downloadAdminAspirasiCsv() {
    const filters = getAdminFilterValues();
    const rows = adminAspirasiCache.filter(function (item) { return adminItemMatches(item, filters); });
    const csvRows = rows.map(function (item) {
      return [item.id, item.timestamp, item.nama, item.statusWisma, item.lantai, item.unit, item.jenisAspirasi, item.kategori, item.detailAspirasi, item.lokasiMasalah || '', item.lokasiMasalahDetail || '', item.statusAspirasi || 'Dibaca', item.prioritas || '', item.catatanTindakLanjut];
    });
    const csv = '\ufeff' + [['ID', 'Tanggal', 'Nama', 'Status Wisma', 'Lantai Pelapor', 'Unit Pelapor', 'Jenis', 'Kategori', 'Detail', 'Jenis Lokasi Masalah', 'Rincian Lokasi Masalah', 'Status Aspirasi', 'Prioritas', 'Catatan Tindak Lanjut']].concat(csvRows).map(function (row) { return row.map(csvCell).join(','); }).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'teras-tower-aspirasi-filtered.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

    overlay.className = 'followup-photo-overlay';
    overlay.onclick = function (event) { if (event.target === overlay) closeFollowupPhotoViewer(); };
    const box = document.createElement('div');
    box.className = 'followup-photo-box';
    const title = document.createElement('div');
    title.className = 'followup-photo-title';

    close.onclick = closeFollowupPhotoViewer;
    const header = document.createElement('div');

    const body = document.createElement('div');

  function saveTindakLanjut(id) {
    const status = document.getElementById('status_' + id).value;
    const catatan = document.getElementById('catatan_' + id).value;
    runServerWithLoader()
      .withSuccessHandler(function (result) {
        if (!result.success) {
          showAppNotice('Gagal update: ' + result.message, 'error');
          // v18 (A11): daftar di layar mungkin sudah usang; muat ulang dari server.
          if (result.notFound) renderAdminDashboard();
          return;
        }
        delete fotoTindakLanjutState[id];
        // Updating an aspiration writes LastUpdatedAt. Mark this menu seen
        // after the write so the admin's own update is not shown as new data.
        clearAdminNotificationBadge('aspirasi');
        runServerWithLoader()
          .withSuccessHandler(function () { renderAdminDashboard(); })
          .withFailureHandler(function (err) { console.error('Status notifikasi aspirasi gagal disimpan', err); renderAdminDashboard(); })
          .markNotificationSeen(currentUser.sessionToken, 'aspirasi');
      })
      .withFailureHandler(function (err) { showAppNotice('Gagal update: ' + err.message); })
      .updateTindakLanjut({ id: id, status: status, catatan: catatan, adminUsername: currentUser.username, foto: fotoTindakLanjutState[id] || null , sessionToken: currentUser.sessionToken });
  }

  let wargaAdminCache = [];
  let wargaAdminPage = 1;
  const WARGA_PAGE_SIZE = 10;
  let wargaAdminLoadedAt = 0;
  let wargaSortKey = 'Nama';
  let wargaSortDirection = 1;
  let wargaSearchQuery = '';
  let wargaSearchField = 'Nama';
  let wargaFilterOpen = false;
  let wargaAdminTab = 'all';
  function isWargaNeedsAttention(row) {
    if (typeof row.NeedsAttention === 'boolean') return row.NeedsAttention;
    if (row.PendingPinReset || row.DataAnomaly) return true;
    if (row.AccountOnlyAdmin) return false;
    const profileComplete = row.ProfileComplete === true || String(row.ProfileComplete || '').toLowerCase() === 'true';
    const phone = String(row.Nomor_WhatsApp || '').trim();
    return !profileComplete || !String(row.Nama || '').trim() || !/^(08[0-9]{8,11}|\+62[0-9]{8,11})$/.test(phone);
  }
  function getWargaPageHeaderHTML() {
    const fields = [['Username', 'Username'], ['Nama', 'Nama'], ['Status_Wisma', 'Status'], ['Lantai', 'Lantai'], ['Unit', 'Unit']];
    const options = fields.map(function (field) {
      return '<option value="' + field[0] + '"' + (wargaSearchField === field[0] ? ' selected' : '') + '>' + field[1] + '</option>';
    }).join('');
    return '<div class="warga-page-heading"><div class="page-title">Kelola Warga</div>' +
      '<div class="warga-search-control"><input id="wargaSearchInput" type="search" placeholder="Cari warga…" value="' + escapeAttr(wargaSearchQuery) + '" oninput="onWargaSearchInput(this.value)" aria-label="Cari warga">' +
      '<button type="button" class="warga-filter-toggle" onclick="toggleWargaFilterMenu()" aria-label="Pilih kolom pencarian" aria-expanded="' + (wargaFilterOpen ? 'true' : 'false') + '" title="Filter pencarian">☰</button>' +
      '<div class="warga-filter-menu' + (wargaFilterOpen ? ' is-open' : '') + '" id="wargaFilterMenu"><label for="wargaSearchField">Cari berdasarkan</label><select id="wargaSearchField" onchange="setWargaSearchField(this.value)">' + options + '</select></div></div></div>' +
      '<div class="warga-tabs" role="group" aria-label="Filter daftar warga">' +
      '<button type="button" class="warga-tab' + (wargaAdminTab === 'all' ? ' active' : '') + '" aria-pressed="' + (wargaAdminTab === 'all' ? 'true' : 'false') + '" onclick="setWargaAdminTab(\'all\')">Semua Warga <span class="warga-tab-count">' + wargaAdminCache.length + '</span></button>' +
      '<button type="button" class="warga-tab' + (wargaAdminTab === 'attention' ? ' active' : '') + '" aria-pressed="' + (wargaAdminTab === 'attention' ? 'true' : 'false') + '" onclick="setWargaAdminTab(\'attention\')">Perlu Tindakan <span class="warga-tab-count">' + wargaAdminCache.filter(isWargaNeedsAttention).length + '</span></button></div>';
  }
  function toggleWargaFilterMenu() {
    wargaFilterOpen = !wargaFilterOpen;
    const menu = document.getElementById('wargaFilterMenu');
    const button = document.querySelector('.warga-filter-toggle');
    if (menu) menu.classList.toggle('is-open', wargaFilterOpen);
    if (button) button.setAttribute('aria-expanded', wargaFilterOpen ? 'true' : 'false');
  }
  function setWargaSearchField(field) {
    const allowed = ['Username', 'Nama', 'Status_Wisma', 'Lantai', 'Unit'];
    if (allowed.indexOf(field) < 0) return;
    wargaSearchField = field;
    wargaAdminPage = 1;
    renderWargaTablePage();
  }
  function onWargaSearchInput(query) {
    wargaSearchQuery = String(query || '').trim();
    wargaAdminPage = 1;
    renderWargaTablePage();
  }
  function getFilteredWargaRows() {
    const query = wargaSearchQuery.toLocaleLowerCase('id');
    const tabRows = wargaAdminTab === 'attention' ? wargaAdminCache.filter(isWargaNeedsAttention) : wargaAdminCache.slice();
    if (!query) return tabRows;
    return tabRows.filter(function (row) {
      return String(row[wargaSearchField] || '').toLocaleLowerCase('id').indexOf(query) >= 0;
    });
  }
  function setWargaAdminTab(tab) {
    if (tab !== 'all' && tab !== 'attention') return;
    wargaAdminTab = tab;
    wargaAdminPage = 1;
    buildKelolaWargaHTML(wargaAdminCache);
  }
  function sortWargaAdminBy(key) {
    const allowed = ['Username', 'Nama', 'Status', 'Lantai', 'Unit', 'WhatsApp', 'Peran'];
    if (allowed.indexOf(key) < 0) return;
    if (wargaSortKey === key) wargaSortDirection *= -1;
    else { wargaSortKey = key; wargaSortDirection = 1; }
    wargaAdminPage = 1;
    renderWargaTablePage();
  }
  function wargaSortHeader(label, key) {
    const active = wargaSortKey === key;
    const arrow = active ? (wargaSortDirection === 1 ? '▲' : '▼') : '↕';
    const ariaSort = active ? (wargaSortDirection === 1 ? 'ascending' : 'descending') : 'none';
    return '<th aria-sort="' + ariaSort + '"><button type="button" class="warga-sort-header" onclick="sortWargaAdminBy(\'' + key + '\')" aria-label="Urutkan berdasarkan ' + escapeAttr(label) + '">' + escapeHtml(label) + '<span aria-hidden="true">' + arrow + '</span></button></th>';
  }
  function getSortedWargaRows(sourceRows) {
    const valueFor = function (row) {
      if (wargaSortKey === 'Peran') return row.IsAdmin ? 'Admin' : 'Warga';
      if (wargaSortKey === 'WhatsApp') return row.Nomor_WhatsApp || '';
      const fields = { Username: 'Username', Nama: 'Nama', Status: 'Status_Wisma', Lantai: 'Lantai', Unit: 'Unit' };
      return row[fields[wargaSortKey]] || '';
    };
    return (Array.isArray(sourceRows) ? sourceRows : wargaAdminCache).slice().sort(function (a, b) {
      const pendingOrder = Number(!!b.PendingPinReset) - Number(!!a.PendingPinReset);
      if (pendingOrder) return pendingOrder;
      const left = String(valueFor(a)).trim();
      const right = String(valueFor(b)).trim();
      if (!left && right) return 1;
      if (left && !right) return -1;
      const compared = left.localeCompare(right, 'id', { numeric: true, sensitivity: 'base' });
      return compared * wargaSortDirection || String(a.Username || '').localeCompare(String(b.Username || ''), 'id', { numeric: true, sensitivity: 'base' });
    });
  }
  function renderKelolaWarga(forceReload) {
    const content = document.getElementById('pageContent');
    const now = Date.now();
    if (!forceReload && wargaAdminCache.length && now - wargaAdminLoadedAt < 30000) {
      buildKelolaWargaHTML(wargaAdminCache);
      return;
    }
    content.innerHTML = getTopBar('Kelola Warga') + getWargaPageHeaderHTML() + '<div id="wargaTableArea"><div class="spinner">Memuat data warga...</div></div>' + getCopyrightFooter();
    runServerWithLoader()
      .withSuccessHandler(function (result) {
        if (!result.authorized) { content.innerHTML = getTopBar('Kelola Warga') + '<div class="empty-state">Anda tidak memiliki akses.</div>' + getCopyrightFooter(); return; }
        wargaAdminLoadedAt = Date.now();
        buildKelolaWargaHTML(result.data);
      })
      .withFailureHandler(function (err) { content.innerHTML = getTopBar('Kelola Warga') + '<div class="empty-state">Gagal memuat data.</div>' + getCopyrightFooter(); console.error(err); })
      .getAllWarga(currentUser.username, currentUser.sessionToken);
  }

  function buildKelolaWargaHTML(list) {
    wargaAdminCache = Array.isArray(list) ? list : [];
    wargaAdminPage = 1;
    const content = document.getElementById('pageContent');
    content.innerHTML = getTopBar('Kelola Warga') + getWargaPageHeaderHTML() + '<div id="wargaTableArea"></div>' + getCopyrightFooter();
    renderWargaTablePage();
  }
  function maskWhatsApp(number) {
    const s = String(number || '');
    if (!s) return 'Belum diisi';
    if (s.length <= 5) return '•••••';
    return s.substring(0, 3) + '••••' + s.substring(s.length - 3);
  }
  function buildCrownIcon(active) {
    return '<span class="crown-icon ' + (active ? 'crown-active' : 'crown-inactive') + '" aria-label="' + (active ? 'Admin aktif' : 'Aktifkan Admin') + '" title="' + (active ? 'Nonaktifkan Admin' : 'Aktifkan Admin') + '"><span>👑</span><i></i></span>';
  }
  function renderWargaTablePage() {
    const area = document.getElementById('wargaTableArea'); if (!area) return;

    const filteredRows = getFilteredWargaRows();
    if (!filteredRows.length) {
      const emptyMessage = wargaAdminTab === 'attention' && !wargaSearchQuery

      area.innerHTML = '<div class="empty-state">' + emptyMessage + '</div>'; return;
    }
    const totalPages = Math.max(1, Math.ceil(filteredRows.length / WARGA_PAGE_SIZE));

    const start = (wargaAdminPage - 1) * WARGA_PAGE_SIZE;

    const pageRows = sortedRows.slice(start, start + WARGA_PAGE_SIZE);

    let html = '<div class="table-meta">Menampilkan ' + (start + 1) + '–' + Math.min(start + WARGA_PAGE_SIZE, filteredRows.length) + ' dari ' + filteredRows.length + countLabel + '</div><div class="data-table-scroll"><table class="app-data-table warga-table"><thead><tr>' + wargaSortHeader('Username', 'Username') + wargaSortHeader('Nama', 'Nama') + wargaSortHeader('Status', 'Status') + wargaSortHeader('Lantai', 'Lantai') + wargaSortHeader('Unit', 'Unit') + wargaSortHeader('WhatsApp', 'WhatsApp') + wargaSortHeader('Peran', 'Peran') + '<th>Aksi</th></tr></thead><tbody>';
    pageRows.forEach(function (w) {
      const username = String(w.Username || '');
      const usernameArg = escapeAttr(JSON.stringify(username));
      const resident = !w.AccountOnlyAdmin;
      const extraAttentionReasons = (Array.isArray(w.AttentionReasons) ? w.AttentionReasons : []).filter(function (reason) {
        return reason !== 'Permintaan reset PIN menunggu' && String(reason).indexOf('Data hunian:') !== 0;
      });
      const attentionReasonHtml = extraAttentionReasons.map(function (reason) {
        return '<span class="warga-attention-detail" title="' + escapeAttr(reason) + '">⚠️ ' + escapeHtml(reason) + '</span>';
      }).join('');
      let actions = '';
      if (resident) {
        actions += '<button class="btn-small btn-edit" title="Verifikasi data warga" onclick="editWargaForm(' + usernameArg + ')">✏️</button>';
        actions += '<button class="btn-small btn-reset' + (w.PendingPinReset ? ' btn-reset-pending' : '') + '" title="' + (w.PendingPinReset ? 'Reset PIN — diminta warga' : 'Reset PIN') + '" aria-label="' + (w.PendingPinReset ? 'Reset PIN, permintaan warga menunggu' : 'Reset PIN') + '" onclick="resetPinWarga(' + usernameArg + ')">🔁' + (w.PendingPinReset ? '<span class="reset-request-action-badge">!</span>' : '') + '</button>';
        actions += '<button class="btn-small btn-reset-whatsapp" title="Reset PIN baru dan siapkan pesan WhatsApp" aria-label="Reset PIN dan siapkan WhatsApp untuk ' + escapeAttr(username) + '" onclick="resetPinAndWhatsApp(' + usernameArg + ')">📨</button>';
        actions += '<button class="btn-small btn-verify-account" title="Kirim WhatsApp verifikasi akun" onclick="verifyResidentAccount(' + usernameArg + ')">📱</button>';
        actions += '<button class="btn-small btn-danger" title="Hapus warga" onclick="hapusWarga(' + usernameArg + ')">🗑️</button>';
        if (currentUser.isSuperAdmin) actions += '<button class="btn-small btn-admin-toggle" title="' + (w.IsAdmin ? 'Nonaktifkan Admin' : 'Aktifkan Admin') + '" onclick="toggleAdminStatus(' + usernameArg + ')">' + buildCrownIcon(!!w.IsAdmin) + '</button>';
      } else {
        actions = '<span class="account-only-note" title="Akun ini dikelola melalui Kelola Admin">Kelola Admin</span>';
