# ===================================================================
# Bongkar zip — untuk mengunggah proyek dari HP
# -------------------------------------------------------------------
# Upload files di browser HP tidak bisa membawa folder. Jadi: unggah SATU
# file .zip (berisi isi proyek) ke akar repo. Workflow ini membongkarnya,
# menghapus zip-nya, menyimpan hasilnya sebagai commit, lalu menjalankan
# "Build APK & PWA".
#
# Catatan: berkas di dalam folder .github/workflows tidak bisa diubah lewat
# zip (dibatasi GitHub). Ubah berkas workflow langsung di github.com.
# ===================================================================
name: Bongkar zip unggahan

on:
  push:
    branches: [main]
    paths: ['*.zip']

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bongkar zip ke akar repo
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -ne 1 ]; then
            echo "::error::Harus ada tepat satu file .zip di akar repo (ditemukan ${#zips[@]})."
            exit 1
          fi
          ZIP="${zips[0]}"
          if unzip -Z1 "$ZIP" | grep -qE '^\.github/workflows/'; then
            echo "::warning::Isi .github/workflows di dalam zip diabaikan (ubah langsung di github.com)."
          fi
          # Kode 11 = pola pengecualian tidak cocok (zip memang tanpa .github): bukan kesalahan.
          unzip -o "$ZIP" -x '.github/workflows/*' -d . || [ $? -eq 11 ]
          git rm -q --cached "$ZIP" || true
          rm -f "$ZIP"

      - name: Simpan sebagai commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -q -m "Bongkar zip unggahan"
            git push
          fi

      - name: Jalankan build APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main
